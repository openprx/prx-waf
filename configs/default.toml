[proxy]
listen_addr = "0.0.0.0:80"
listen_addr_tls = "0.0.0.0:443"

[api]
listen_addr = "0.0.0.0:9527"

[storage]
database_url = "postgresql://prx_waf:prx_waf@postgres:5432/prx_waf"
max_connections = 20

# ── Retention (TTL) for the observability / PII tables ────────────────────────
# Nine tables accumulate rows on the request, admin or sync path and every one of
# them holds either personal data or dead security material. One background task
# sweeps them all on the cadence below and deletes rows older than each table's
# own window. Setting any window to 0 keeps that table's rows forever — the table
# then grows without bound and startup logs a WARN naming the data being retained.

# Lane 2 semantic shadow telemetry (client_ip + req_id per detection). Exists to
# tune detection / false-positive rates, a short-horizon activity, so it sits at
# the low end of the usual 30–90 day security-log range.
semantic_observation_retention_days = 30

# Rule detections behind the dashboard (client_ip, method, path, geo). A quarter
# is the shortest window that still answers "new campaign or recurring?" and is
# the conventional hot window for security logs (PCI DSS 10.5.1: three months
# immediately available). Not longer, because every row carries a client IP.
security_event_retention_days = 90

# Blocked/logged requests (client_ip, path, query, captured request headers).
# Kept in lockstep with security_events — the same incident from the request
# side — and no longer, since headers can contain tokens and session cookies.
attack_log_retention_days = 90

# Admin API mutations (admin_username, admin source ip_addr). Deliberately much
# longer: this is accountability data about a small known internal population,
# not end-user PII, and one year is the common compliance floor (PCI DSS 10.5.1,
# what SOC 2 / ISO 27001 auditors sample). Grows with admin activity, not traffic.
audit_log_retention_days = 365

# CrowdSec decision events (client_ip, scenario). The CrowdSec LAPI keeps the
# authoritative history; these rows only answer "did the bouncer act on this IP?"
# during integration checks or a block dispute.
crowdsec_event_retention_days = 30

# Cached CrowdSec LAPI decisions (value holds the banned client IP when
# scope='Ip'). Keyed on the decision's own expiry, not row insertion time: a
# decision is deleted once it has been expired for longer than this window. An
# active decision (or one with no known expiry) is never touched regardless of
# row age.
crowdsec_decision_retention_days = 3

# Refresh token hashes. Keyed on expires_at, but a revoked token is deleted on
# the next sweep regardless of this window — it can never be redeemed again, so
# there is no reason to wait out its natural expiry.
refresh_token_retention_days = 7

# Notification delivery records. message/error_msg are free text supplied by the
# triggering event and may embed a client_ip, so the window matches
# crowdsec_event_retention_days.
notification_log_retention_days = 30

# Aggregated per-host request/block counters — no personal data. Keyed on the
# aggregation bucket's own period_start. Long window since there is no privacy
# pressure, only storage cost, and the admin UI's trend views want it.
request_stats_retention_days = 180

retention_prune_interval_hours = 6      # sweep cadence; clamped to >= 1
retention_prune_batch_size = 5000       # rows per DELETE; clamped to 1..=100000

# ── Phase 5: Response Caching ─────────────────────────────────────────────────
[cache]
enabled = true
max_size_mb = 256
default_ttl_secs = 60
max_ttl_secs = 3600

# ── Phase 5: HTTP/3 (QUIC) ────────────────────────────────────────────────────
# HTTP/3 needs a TLS cert + key, so it stays off for a zero-config single node.
# It auto-enables once BOTH cert_pem and key_pem are configured (no need to also
# flip `enabled`); uncomment those two lines to turn it on.
[http3]
enabled = false
listen_addr = "0.0.0.0:443"
# cert_pem = "/etc/prx-waf/tls/cert.pem"
# key_pem  = "/etc/prx-waf/tls/key.pem"

# ── GeoIP-based access control ────────────────────────────────────────────────
# Enabled by default. Pure-detection feature that degrades gracefully: when the
# xdb database files are missing the service logs a warning and is skipped (no
# blocking, no crash), and it has no effect until country/region rules are added.
# Download the databases with:  prx-waf geoip download
[geoip]
enabled = true
ipv4_xdb_path = "data/ip2region_v4.xdb"
ipv6_xdb_path = "data/ip2region_v6.xdb"
# Cache policy: full_memory (~20MB, fastest) | vector_index (~2MB) | no_cache
cache_policy = "full_memory"

# ── Phase 5: Security Hardening ───────────────────────────────────────────────
[security]
# List of IPs/CIDRs allowed to access the admin API.  Empty = allow all.
admin_ip_allowlist = []
# Maximum request body size (bytes).  Default 10 MB.
max_request_body_bytes = 10485760
# Per-IP rate limit for the admin API (req/s).  0 = disabled.
# Default 100 req/s per IP (burst 500): protects the management surface from
# brute-force / scripted abuse without disrupting normal admin-UI usage.
api_rate_limit_rps = 100
# CORS origins for admin API.  Empty = deny all cross-origin (secure default).
cors_origins = []

# ── Example host configuration ────────────────────────────────────────────────
# [[hosts]]
# host = "example.com"
# port = 80
# remote_host = "127.0.0.1"
# remote_port = 8080
# guard_status = true
# # Detect but do not enforce: every block this host would produce is logged and
# # the request is proxied through anyway. ModSecurity's `SecRuleEngine
# # DetectionOnly`. Default false (enforce).
# log_only_mode = false

# ── Cluster Configuration (disabled by default — opt-in) ──────────────────────
# Remove the leading '#' characters from the [cluster] section to enable.
#
# [cluster]
# # Enable clustering. Default: false — zero behavior change for standalone deployments.
# enabled = false
#
# # Unique node identifier. Auto-generated from hostname+uuid suffix if empty.
# node_id = ""
#
# # Role assignment. "auto" participates in leader election.
# # Values: "auto" | "main" | "worker"
# role = "auto"
#
# # QUIC listen address for inter-node communication.
# listen_addr = "0.0.0.0:16851"
#
# # Static seed nodes. At least one reachable seed required to join a cluster.
# # seeds = ["10.0.0.1:16851", "10.0.0.2:16851"]
# seeds = []
#
# # Join token presented by a worker during the join handshake. Generate with
# # `prx-waf cluster token generate --ttl 24h` and copy it into every worker's
# # config (or PRXWAF_CLUSTER_JOIN_TOKEN). The main validates it against the
# # cluster CA key and burns its nonce on first use — an empty or reused token
# # is rejected.
# join_token = ""
#
# ⚠ PRODUCTION REQUIREMENT — set this to the full, fixed list of node ids
# before going to production. Left empty (the default), election quorum is
# computed from the *live* peer view instead of a fixed size: as peers get
# evicted (dead-peer cleanup after missed heartbeats — normal behavior during
# a network partition), the quorum denominator shrinks right along with them.
# Taken to its conclusion, a single node that gets partitioned away from the
# rest of the cluster will, once it has evicted its now-unreachable peers, see
# itself as a "1-node cluster" and self-promote to Main WITHOUT an election —
# indistinguishable, from its own point of view, from a genuine single-node
# deployment. If the other side of the partition still holds a working
# majority, you now have two Mains simultaneously accepting writes: split-brain.
# Declaring `members` fixes the denominator to this list's length, so a
# partitioned minority can never manufacture a majority no matter how many of
# its peers it evicts. The list must be identical, byte-for-byte, on every
# node in the cluster, and updated on every existing node (not just the new
# one) whenever you add or remove a member.
# members = ["node-a", "node-b", "node-c"]
#
# ⚠ KEEP FALSE — the cluster CA private key is the root of trust for the
# whole mesh: mTLS peer identity, join tokens, and election vote grants are
# all "does this chain to the CA and match the claimed node_id." Only the
# main node holds this key by default (ca_key is empty on workers, and they
# never read a CA key file). Flipping this to true makes the main encrypt its
# CA private key (AES-256-GCM, keyed off cluster.crypto.ca_passphrase below)
# and ship it to EVERY worker that joins, in memory, "for failover." That
# turns a single compromised worker into a full CA compromise — mint certs
# for any node_id, forge votes, become the accepted Main for the whole
# cluster — instead of just that one node's blast radius.
# #
# # As of this version the trade is one-sided: the blob a worker receives is
# # only ever stored (NodeState.ca_key_encrypted), and nothing ever decrypts it
# # back into a usable CA key on promotion. You pay the full security cost above
# # and get none of the automatic CA failover it exists for. Leave it false
# # until that path is wired up. Even then, enable it only if every node that
# # could receive the key sits in the same trust tier you'd put the CA key
# # itself in, and ca_passphrase is a long random secret managed like the CA key
# # (not a memorable string in a committed file). See
# # docs/cluster-security-defaults.md before enabling.
# replicate_ca_key = false
#
# [cluster.crypto]
# ca_cert   = "/app/certs/cluster-ca.pem"
# node_cert = "/app/certs/node.pem"
# node_key  = "/app/certs/node.key"
# # Auto-generate CA and node certs on first startup (required for initial main).
# auto_generate       = true
# ca_validity_days    = 3650   # 10 years
# node_validity_days  = 365    # 1 year
# renewal_before_days = 7      # auto-renew 7 days before expiry
# # Passphrase used to encrypt the CA private key when cluster.replicate_ca_key
# # = true above. Empty disables replication regardless of replicate_ca_key.
# # Minimum 16 characters are enforced, but treat this as CA-key-grade
# # material, not a password: generate it with a CSPRNG and store it in a
# # secrets manager, identical on every node that might decrypt it.
# ca_passphrase = ""
#
# [cluster.sync]
# rules_interval_secs        = 10    # periodic rule version check
# config_interval_secs       = 30
# events_batch_size          = 100   # flush event batch at this count
# events_flush_interval_secs = 5     # flush even if batch not full
# stats_interval_secs        = 10
# events_queue_size          = 10000 # drop oldest if worker falls behind
#
# [cluster.election]
# timeout_min_ms        = 150    # random election timeout range (ms)
# timeout_max_ms        = 300
# heartbeat_interval_ms = 50     # main → workers heartbeat interval
# phi_suspect           = 8.0
# phi_dead              = 12.0
#
# [cluster.health]
# check_interval_secs   = 5
# max_missed_heartbeats = 3

# ── Community Integration ─────────────────────────────────────────────────────
# Share threat intelligence with the OpenPRX community network.
# Enable to report detected attacks and receive the community blocklist.
# Run `prx-waf community enroll` first to obtain machine_id and api_key.
#
# [community]
# enabled = false
# server_url = "https://community.openprx.dev"
# api_key = ""           # Obtained from: prx-waf community enroll
# machine_id = ""        # Obtained from: prx-waf community enroll
# public_key = ""        # Ed25519 hex (64 chars). If set but invalid, init is refused.
# batch_size = 50        # Number of signals to buffer before flushing
# flush_interval_secs = 30   # Flush buffer even when batch_size not reached
# sync_interval_secs = 300   # Blocklist sync interval (default: 5 minutes)

# ── Threat-Intelligence IP Feeds (disabled by default — opt-in) ───────────────
# Pull raw IP/CIDR blocklists from external open-source intelligence sources and
# fold matching addresses into the WAF IP blacklist (403). NO feed is fetched
# unless you uncomment an [[ip_feeds]] block below.
#
# ⚠ LICENSING — READ BEFORE ENABLING. These sources are free but carry terms:
#   • ET Open (Emerging Threats) — BSD-licensed. Free to use.
#   • Tor exit list              — CC0 / public domain. Free to use.
#   • Spamhaus DROP              — free BUT requires ATTRIBUTION and FORBIDS
#                                  some commercial redistribution. Review
#                                  https://www.spamhaus.org/drop/ terms first.
# Enabling a feed is your acknowledgement of its license. This is why the
# default ships with everything commented out.
#
# format: "plain"         — one IP/CIDR per line; `#` and `;` comments tolerated
#         "spamhaus_json" — Spamhaus DROP JSONL (one {"cidr":...} object/line)
#
# Emerging Threats Open — compromised / known-bad IPs (BSD license):
# [[ip_feeds]]
# name = "et-open-compromised"
# url = "https://rules.emergingthreats.net/blockrules/compromised-ips.txt"
# format = "plain"
# update_interval_secs = 3600
# enabled = true
#
# Tor exit nodes (CC0 / public domain):
# [[ip_feeds]]
# name = "tor-exit-nodes"
# url = "https://check.torproject.org/torbulkexitlist"
# format = "plain"
# update_interval_secs = 3600
# enabled = true
#
# Spamhaus DROP (Don't Route Or Peer) — ATTRIBUTION REQUIRED, see terms above:
# [[ip_feeds]]
# name = "spamhaus-drop"
# url = "https://www.spamhaus.org/drop/drop_v4.json"
# format = "spamhaus_json"
# update_interval_secs = 86400
# enabled = true

# ── CrowdSec Integration ──────────────────────────────────────────────────────
# CrowdSec needs an external LAPI endpoint + bouncer key, so it stays off for a
# zero-config single node. It auto-enables once `api_key` is set (no need to also
# flip `enabled`). A failed connection fails safe (logged, non-fatal).
# Run `prx-waf crowdsec setup` for a guided walkthrough.
#
# [crowdsec]
# enabled = false
# mode = "bouncer"                   # bouncer | appsec | both
# lapi_url = "http://127.0.0.1:8080"
# api_key = ""                       # from: cscli bouncers add prx-waf-bouncer
# update_frequency_secs = 10
# fallback_action = "allow"          # allow | block | log (LAPI bouncer)
# appsec_failure_action = "allow"    # allow | block | log (AppSec, independent)
# persist_decisions = true           # mirror decisions to the DB; see below
#
# `fallback_action` — WHAT THE BOUNCER DOES WHEN IT HAS NOTHING TO ENFORCE.
# It applies in exactly one state: the decision cache is EMPTY *and* the last
# LAPI pull failed (or none has happened yet). In that state a cache miss carries
# no information — the bouncer is not saying "this IP is clean", it is saying "I
# never got the list".
#
#   allow  (default)  serve the request. The historical behaviour; unchanged.
#   log               serve the request, but record a `crowdsec:lapi-unavailable`
#                     security event for it, so the window is auditable. One
#                     event per request for as long as the outage lasts.
#   block             refuse the request with 403. Fail closed. A LAPI outage
#                     then takes down every site behind this node, so only choose
#                     it where refusing traffic beats admitting unvetted traffic.
#                     The startup log WARNs when this is set.
#
# A pull that fails while decisions ARE cached does NOT trigger it: those
# decisions are stale, not absent, and the bouncer keeps enforcing them. There is
# deliberately no staleness deadline — bounding it would need a separate operator
# -supplied tolerance, and silently inventing one would make `block` fire during
# ordinary network blips.
#
# This is independent of `appsec_failure_action`, which governs the AppSec
# engine's own outages (mode = "appsec" ignores `fallback_action` entirely,
# because the decision cache is never consulted there).
#
# RESTART FAIL-OPEN AND `persist_decisions`. The bouncer enforces from an
# in-memory decision cache that starts EMPTY on every process start, and the
# first LAPI pull runs on a background task *after* the proxy starts serving. If
# LAPI is unreachable at that moment — container start order, a network blip, the
# CrowdSec container not up yet — the pull fails, the cache stays empty, and the
# bouncer matches no IP at all: every previously banned client is allowed
# through, for as long as LAPI stays down.
#
# `persist_decisions = true` (the default) mirrors every cached decision into the
# `crowdsec_decisions` table and reloads the still-valid ones BEFORE the proxy
# starts serving, so a restart with a dead LAPI keeps enforcing what it already
# knew. Restored decisions are provisional: the first successful FULL pull
# replaces the mirror wholesale and evicts every restored entry it does not
# confirm, so a ban lifted while the process was down cannot be resurrected. The
# startup log states how many decisions were restored, and a failed pull with an
# empty cache is logged at ERROR naming the fail-open consequence.
#
# Set it to false only when banned client IPs must not be written to the database
# at all (they are personal data — `storage.crowdsec_decision_retention_days`
# bounds how long they are kept), or when the database is read-only. The startup
# log then WARNs that the fail-open window is back.

# ── [rules] — read by the CLI, NOT by the running proxy ───────────────────────
#
# There is a `[rules]` section in the config schema (`dir`, `hot_reload`,
# `reload_debounce_ms`, `enable_builtin_owasp`, `enable_builtin_bot`,
# `enable_builtin_scanner`, `[[rules.sources]]`). It is deliberately absent
# here, because setting it would not change what the daemon does.
#
# `RuleManager` — the only consumer of those keys — is constructed by exactly
# four CLI subcommands: `rules validate`, `rules import`, `rules export` and
# `rules update` (`crates/prx-waf/src/main.rs`). `sources list` reads
# `[[rules.sources]]` straight off the config. Nothing else touches the section:
# the serving process never builds a `RuleManager`, and the `rules` reads
# (`list`, `info`, `search`, `stats`) report the enforced set instead — the CRS
# rules this build compiled, with the database overrides layered on. What the
# request path actually uses is:
#
#   * the OWASP CRS set, compiled at startup from `rules/owasp-crs/`, a
#     hardcoded path (`crates/waf-engine/src/checks/owasp.rs:53`). `rules.dir`
#     does not move it and `enable_builtin_owasp = false` does not switch it
#     off. Tune it with `[owasp]` below and with the per-host paranoia level.
#   * every operator-managed rule — hosts, IP and URL lists, custom rules,
#     sensitive-data patterns — from the database, over the admin API.
#
# `hot_reload` / `reload_debounce_ms` in particular reload nothing: the file
# watcher they configure (`crates/waf-engine/src/rules/hot_reload.rs`) is never
# started, and `prx-waf rules reload` is not implemented. Overrides are applied
# to a running process with `POST /api/rules/reload`; an edited CRS file needs a
# restart.
#
# The other directories under `rules/` (`advanced/`, `owasp-api/`,
# `modsecurity/`, `cve-patches/`, `bot-detection/`, `custom/`) are not loaded by
# anything, by decision rather than by omission: see the audit table in
# `rules/README.md`.

# ── OWASP CRS anomaly scoring ─────────────────────────────────────────────────
#
# How the OWASP CRS phase turns rule matches into one verdict.
#
# Upstream CRS does NOT block on the first rule that matches. Nearly every rule
# carries `pass` (from `SecDefaultAction "phase:2,log,auditlog,pass"`) plus a
# `setvar:tx.inbound_anomaly_score_plN=+%{tx.<severity>_anomaly_score}`, and one
# dedicated rule — 949110 in REQUEST-949-BLOCKING-EVALUATION.conf:226 — denies
# the request once the accumulated score reaches the threshold. The numbers below
# are the ones CRS v4.25.0 itself ships (REQUEST-901-INITIALIZATION.conf: rules
# 901100/901110 for the thresholds, 901140..901143 for the weights), so leaving
# this section out reproduces stock CRS behaviour exactly.
#
# WHAT THIS DOES AND DOES NOT CHANGE. With `critical = 5` against a threshold of
# 5, a single critical rule still blocks on its own — and 206 of the 216 enforced
# REQUEST-phase rules in `rules/owasp-crs/` are critical. What changes is the
# remaining 10, which are `warning` (+3): they now score and wait for a second
# rule instead of blocking alone. That is upstream's own false-positive control,
# not a relaxation of the rule set. The startup log prints the split.
# (The other 58 enforced rules are response-phase; see below.)
#
# The paranoia level is per-host (`defense_json.owasp_paranoia`), not here. It
# gates which rules are evaluated at all; a rule above the host's level
# contributes nothing, exactly as upstream's tx.inbound_anomaly_score_pl1..pl4
# buckets do.
#
# RESPONSE PHASE. The CRS response rules (950–956, `rules/owasp-crs/data-leakage*`
# and `web-shells.yaml`) are evaluated against a SECOND, independent accumulator
# with its OWN threshold, exactly as upstream does: those rules only ever
# `setvar:tx.outbound_anomaly_score_plN=+…` and rule 959100 in
# RESPONSE-959-BLOCKING-EVALUATION.conf compares the total against
# `tx.outbound_anomaly_score_threshold`, which CRS initialises to **4** — not to
# the inbound 5. With the weights below that means a single `error` response rule
# acts on its own, which is upstream's posture and not a local decision.
#
# What "acts" means here is narrower than for a request, and structurally so: the
# response status line is already on the wire by the time a body rule can fire, so
# enforcement withholds bytes and aborts the stream rather than answering 403 (see
# crates/gateway/src/response.rs). Because a truncated page is a visibly broken
# one, the response phase DEFAULTS TO OBSERVE — it logs and delivers. Enforcement
# is opt-in through `PRXWAF_RESPONSE_INSPECT_MODE=enforce`.
[owasp]
anomaly_scoring = true                # false → first matching rule blocks (STRICTER than upstream; FP source)
critical_anomaly_score = 5            # tx.critical_anomaly_score
error_anomaly_score = 4               # tx.error_anomaly_score
warning_anomaly_score = 3             # tx.warning_anomaly_score
notice_anomaly_score = 2              # tx.notice_anomaly_score
inbound_anomaly_score_threshold = 5   # tx.inbound_anomaly_score_threshold — CRS 949110 denies at >= this
outbound_anomaly_score_threshold = 4  # tx.outbound_anomaly_score_threshold — CRS 959100 acts at >= this

# ── Rule-hit audit log ────────────────────────────────────────────────────────
# One line per CRS rule that matched, plus one line for the anomaly-score verdict,
# in the bracketed `[id "942100"] [msg "..."]` shape ModSecurity writes to the web
# server error log.
#
# WHY, given `security_events` exists: that table records the *verdict* — one row,
# one rule, the heaviest contributor. Since anomaly scoring landed, a request can
# match three rules and still be allowed, and nothing anywhere records that. This
# file does, which is what makes a threshold or a paranoia level tunable from
# evidence instead of from guesswork.
#
# OFF BY DEFAULT. Enabling it opens a file and writes to it; no existing
# deployment asked for that.
#
# PII: request *metadata* only — client IP, host, method, URI path (the set
# `attack_logs` already stores). The query string is opt-in and the matched data
# is never written. `max_size_mb` / `keep_rotations` bound both the disk cost and
# how long that metadata survives, the way `[storage] *_retention_days` bounds the
# database tables. Writes happen on a background task through a bounded channel,
# so the request path never waits on the disk.
#
# [audit_log]
# enabled = false
# path = "logs/audit.log"
# max_size_mb = 64            # rotate past this size; 0 = never rotate
# keep_rotations = 3          # generations kept (audit.log.1 … .3); the oldest is deleted
# include_query = false       # append ?query to the logged URI — user data, opt in deliberately
# marker_header = ""          # echo this header's value as a log marker; "" = off.
#                             # Set to "X-CRS-Test" for go-ftw log mode: a request
#                             # carrying it logs only the marker, mirroring upstream
#                             # CRS's rule 999999 + ctl:ruleRemoveById=1-999999.

# ── Lane 2 Semantic Content-Security Engine ───────────────────────────────────
# Additive semantic scoring layer (SQLi/RCE/…) that sits behind the frozen legacy
# detectors. P1b ships the first real detector (structural SQLi).
#
# DEFAULT-ON SHADOW (log_only): the lane is ON by default (`enabled = true`) in
# this shipped config, but runs in shadow — it detects + logs + persists a
# de-identified observation and NEVER blocks. Target-practice measured 0 false
# positives and 100% detection on the bypass corpus, and every preprocessing /
# detection step is bounded by the budget caps below, so shadow-on is a safe
# default. Flip `enforcement_mode` (or a per-family override, below) to change the
# posture. The shipped `log_only` here is byte-for-byte identical to the pre-E0
# behaviour — operators must opt in explicitly to enforce.
#
# enforcement_mode truth table (when `enabled = true`):
#   off       → the lane does NO work: no detection, no LogOnly event, no
#               `semantic_observations` row. Equivalent to `enabled = false`.
#   log_only  → SHADOW: detect + log a LogOnly security event + persist a
#               de-identified observation. NEVER a Block.
#   enforce   → BLOCK-CAPABLE (E0). A Block is produced ONLY when ALL of these
#               hold: the process has passed the restart warmup window
#               (breaker.window), the request's canary bucket is inside
#               `rollout_bps`, the circuit breaker is closed, the host is NOT in
#               `log_only_mode`, and the Block is corroborated by a directly-
#               observable (non-blind/-synthetic) view. Otherwise it stays shadow
#               `Log`. With the shipped `rollout_bps = 0` even `enforce` blocks
#               nothing (empty canary) — set `rollout_bps` to opt in gradually.
#
# A zero-config install with no config file at all also leaves the lane OFF (the
# compiled default is `enabled = false`).
[content_security]
enabled = true                        # master switch (default-on SHADOW; log_only never blocks)
enforcement_mode = "log_only"         # off | log_only (shadow) | enforce (block-capable, opt-in, canary-gated)
dialect = "generic"                   # global; per-host dialects not claimed in P1
hpp = false                           # HTTP-parameter-pollution synthetic views (global off)
rollout_bps = 0                       # canary width in basis points (0..10000); 0 → enforce blocks nothing
rollout_salt = ""                     # stable salt for deterministic canary bucketing

# Per-family enforcement overrides (E0). Each key is an attack family
# (sql_injection / rce / xss / traversal); each value is off | log_only | enforce
# and overrides `enforcement_mode` for THAT family only. A family not listed here
# inherits the global mode, so this table is EMPTY by default (→ pure global
# posture, zero behaviour change). This lets an operator switch the single
# highest-confidence family to enforce while the rest stay shadow, e.g.:
#   [content_security.enforcement_overrides]
#   sql_injection = "enforce"
#
# ── A3 contract: per-host Lane 1 toggles vs Lane 2 families (READ THIS) ────────
# The per-host Lane 1 legacy checker toggles (HostConfig.defense_config.sqli /
# .xss / .rce / .dir_traversal) and the Lane 2 semantic families here are TWO
# INDEPENDENT switch sets. Turning off a host's Lane 1 sqli checker does NOT turn
# off that host's Lane 2 sql_injection family — they must be managed separately.
# The single per-host total kill switch for BOTH lanes' blocking is the host's
# `log_only_mode`: when a host is in log_only_mode, every Lane 1 veto AND every
# Lane 2 enforce Block is downgraded to a LogOnly event for that host. (Runtime
# per-host, per-detector Lane 1 gating of Lane 2 is still a backlog item, but the
# Lane 1 toggles themselves DO have a runtime write path: the admin API persists
# them to hosts.defense_json and projects them onto the live HostConfig without a
# restart. Contract ② — the two switch sets stay independent — applies either way.)
[content_security.enforcement_overrides]

[content_security.budget]             # deterministic DoS work caps (conservative)
max_fields_per_phase = 64
max_views_per_field = 12
max_ast_attempts_per_request = 6
max_ast_input_bytes_total = 262144
max_html_parse_attempts_per_request = 6    # XSS DOM detector HTML5 fragment-parse cap (P-XSS-1)
max_html_parse_input_bytes_total = 262144  # total bytes handed to the HTML parser per request
max_tokens_per_view = 512
max_list_items = 1024
max_preprocess_output_bytes_total = 524288
max_field_input_bytes = 16384         # per-field input cap, checked before any decode/alloc
max_decode_rounds = 3

# ── Lane 1 body budget — OFF BY DEFAULT, and read this before turning it on ───
# The only work budget that applies to Lane 1: the four frozen legacy regex
# detectors (sqli / xss / rce / dir_traversal). Lane 2 has the caps above and the
# CRS body processors stop at a hardcoded 64 KiB; Lane 1 had nothing, so its cost
# tracked body size all the way to the 10 MiB inspection ceiling.
#
# WHAT IT COSTS YOU TO LEAVE IT AT 0 (the default). Measured on a Ryzen 9 5900HX,
# CPU µs per request over the same binary with detection off (tests/perf/RESULTS.md):
#
#             small GET   1 KiB JSON   64 KiB upload   1 MiB body
#   Lane 1        +83        +616         +21,469       +102,228
#   CRS PL1       +88        +487            +199         +4,667
#   Lane 2        +41        +127             +74            +20
#
# The proxy is single-threaded (no config key changes that), so a default install
# serves ~47 rps of 64 KiB uploads and ~9 rps of 1 MiB bodies PER PROCESS. Body
# size, not request rate, is what exhausts prx-waf — and it is reachable by any
# unauthenticated client that can POST.
#
# WHAT IT COSTS YOU TO TURN IT ON. A body larger than `max_body_bytes` is SKIPPED
# by those four detectors — not truncated. Zero body bytes are examined, so a
# payload anywhere in an oversized body is invisible to Lane 1. Still inspected:
# the path, query string, cookies, the scanned request headers, every CRS rule
# (its own 64 KiB structured cap, unlimited raw-body scan) and Lane 2 (its own
# budget). Every skip is counted and logged (WARN, at most one line per 30 s) —
# it is never silent. This is the same "skip past the cap" semantic the CRS body
# processors already use, deliberately, so there is one rule to learn.
#
# HOW TO SIZE IT. Set it just above the largest body your application legitimately
# posts. If you take file uploads, note that the budget is judged from the
# declared Content-Length as well as from the 64 KiB inspection window, so a large
# declared body is skipped from its first window rather than after paying for one.
# A chunked request declares no length; with a budget at or above ~68 KiB such a
# body still gets scanned in full.
#
# [content_security.lane1]
# max_body_bytes = 0                  # 0 = UNLIMITED (default: no behaviour change)
#                                     # e.g. 65536 → bodies over 64 KiB are not
#                                     # inspected by sqli/xss/rce/dir_traversal

[content_security.breaker]            # anomaly-rate circuit breaker
window_secs = 300
min_samples = 200
anomaly_rate_threshold = 0.05
cooldown_secs = 900

# Per-attack scoring families (enabled ones require weights summing to 1.0).
# SQLi is defined with the single structural detector. The family only runs when
# the lane above is `enabled = true`.
#
# hard_veto_allowlist is EMPTY: no rule is authorised for single-hit Block before
# holdout calibration (plan v2.2 "先标定、后授权"). Even if a rule were listed, in
# the P1b shadow posture it can only be logged, never enforced.
#
# The structural detector ships high-noise rules (stacked / chr / hex /
# information_schema) DISABLED by default (plan v2.2). Only the lower-FP rules
# (into_outfile / dangerous_fn / union_select / union_null / version_comment) run
# by default; the rest await holdout data before being turned on.
[content_security.attacks.sql_injection]
enabled = true
log_threshold = 30
block_threshold = 80
hard_veto_allowlist = []              # empty until holdout-calibrated (no single-hit Block authorised)
# Two detectors, equal contribution (Σ = 1.0). A single detector firing alone
# scores 0.5 × its confidence; the lowest-confidence default-on structural rule is
# version_comment (conf 70 → 35), so log_threshold = 30 keeps EVERY single
# default-on detector hit observable in shadow (35 ≥ 30, and the higher-confidence
# rules well above). log_threshold = 40 used to silence single hits below conf 80
# (union_select 72 → 36, union_null 78 → 39, version_comment 70 → 35 all < 40),
# dropping their shadow observations — the calibration data the shadow phase exists
# to collect. A Block recommendation still requires BOTH the structural regex
# detector AND the sqlparser AST detector to corroborate on the same field
# (0.5·c_struct + 0.5·c_ast ≥ 80), so no single detector can recommend Block. Still
# shadow (log_only) regardless of score.
[content_security.attacks.sql_injection.weights]
struct_rule = 0.5                     # OpenRASP-style structural / regex detector (P1b)
ast = 0.5                             # sqlparser-rs true-AST detector (P2)

# RCE (shell command injection) — P1c structural detector. Runs on the Lane-2
# decode/normalise views (base64/hex/entity/comment-strip + SHELL de-obfuscation)
# that the frozen Lane 1 RceCheck's URL-decode-only path cannot see. Default-on
# rules are context-narrowed (reverse-shell fingerprints, `$(cmd)` substitution,
# `sh -c` exec flag, pipe-to-shell, fetch+arg, sensitive-file read); the high-noise
# rules (bare separator + common command, backtick-wraps-anything) ship DISABLED
# and await holdout calibration.
[content_security.attacks.rce]
enabled = true
log_threshold = 40
block_threshold = 80
hard_veto_allowlist = []              # empty until holdout-calibrated (no single-hit Block authorised)
# Two-detector corroboration (T1-A): a Block needs BOTH the structural regex and
# the true shell-AST detector (0.5·c_struct + 0.5·c_ast), so no single detector
# recommends Block. Still shadow (log_only) — never enforced pre-holdout.
[content_security.attacks.rce.weights]
rce = 0.5                             # self-authored structural shell-injection detector
rce_ast = 0.5                         # brush-parser true shell-AST detector (T1-A)

# Traversal T1 (encoded path traversal) — P1c structural detector. T0 is the
# frozen Lane 1 DirTraversalCheck (raw `../`, `%2e%2e`, overlong, sensitive abs
# paths). This additive T1 re-catches those structures on the Lane-2-only decode
# views (a traversal wrapped in base64, or split by quotes so `/etc/passwd` never
# appears raw). Default-on: encoded / overlong / sensitive-absolute (almost never
# legitimate); the plain-`../` rule ships DISABLED (relative imports are too noisy)
# and awaits holdout calibration.
[content_security.attacks.traversal]
enabled = true
log_threshold = 40
block_threshold = 80
hard_veto_allowlist = []              # empty until holdout-calibrated (no single-hit Block authorised)
[content_security.attacks.traversal.weights]
traversal = 1.0                       # segment-aware traversal detector

# XSS (P-XSS-1/2) — two-detector HTML5-semantic family. The DOM detector
# (`xss_dom`, P-XSS-1) upgrades XSS from the frozen Lane 1 regex (kept, additive)
# to a WHATWG fragment parse: it fires only on structures that REALLY parse into
# executable content — a `<script>` element, an `on*=` handler on a genuinely-
# parsed element, a dangerous URL scheme (`javascript:` / `data:text/html` /
# `vbscript:`) on a real URL attribute, or `<svg onload>` / `<iframe srcdoc>`.
# Text that merely contains `onclick=` or `<script` (bug comments, docs, CSV, URL
# paths) parses to NO such element and stays clean — the false-positive win over
# the Lane 1 regex. The JS-token detector (`xss_js`, P-XSS-2) is the second
# detector: from that SAME single parse it classifies only ATTACK-SPECIFIC JS
# tokens inside the parsed event-handler values and `javascript:` URL bodies —
# credential/storage theft (document.cookie/document.domain/localStorage), dynamic
# code execution (eval/execScript/import) and obfuscation decode
# (atob/String.fromCharCode/unescape). It deliberately does NOT fire on the plain
# JS a legitimate inline handler routinely carries (a bare fetch/XMLHttpRequest,
# setTimeout, location navigation, .src= assignment, innerHTML write): those are
# evidence of "this is JS", not of an attack. Narrowing to attack-specific verbs
# is what keeps xss_js independent of xss_dom — a real handler trips the DOM
# structure but not the token detector. Runs on every decode view
# (base64/hex/entity), so encoded XSS surfaces too; blind-decoded hits are never
# hard-veto-capable.
#
# Two detectors, equal contribution (Σ = 1.0), mirroring SQLi. A single detector
# firing alone scores 0.5 × its confidence; the lowest default-on construct is
# `xss.data_html_url` (conf 82 → 41) and every other default-on DOM/JS construct
# is higher (event_handler 85 → 42.5, js_sink 85 → 42.5, iframe_srcdoc 85 → 42.5,
# svg_onload 88 → 44, js_exfil 88 → 44, script_tag 90 → 45), so log_threshold = 40
# keeps EVERY single default-on hit observable in shadow. Corroboration raises the
# BLOCK bar: reaching 0.5·c_dom + 0.5·c_js ≥ 80 needs the DOM structure AND a JS
# token on the same field, so no single detector can recommend Block —
# e.g. `<img onerror=eval(document.cookie)>`. NOTE this is a higher Block bar, NOT
# an independent-evidence guarantee for the mainstream XSS surface: a real inline
# handler contains real JS, so DOM-structure and JS-value are correlated there —
# the discrimination comes from xss_js only counting attack-specific actions
# (above), not from the two signals being independent. A legitimate
# `onclick="fetch('/api')"` therefore trips xss_dom alone (Log), not corroboration.
# The Block bar still needs holdout calibration on real traffic before it can gate
# enforcement; everything here is shadow (log_only) and never blocks. The noisy
# `xss.object_embed` / `xss.base_href` DOM constructs ship DEFAULT-OFF (fire-drill
# FP-4: legitimate media/PDF embeds and SPA `<base href>` hit them 3/3).
[content_security.attacks.xss]
enabled = true
log_threshold = 40
block_threshold = 80
hard_veto_allowlist = []              # empty until holdout-calibrated (no single-hit Block authorised)
[content_security.attacks.xss.weights]
xss_dom = 0.5                         # HTML5 DOM semantic detector (P-XSS-1)
xss_js = 0.5                          # lightweight JS-token detector (P-XSS-2)

# XXE (XML external entity) — T2-A single-detector structural family. Matches the
# DTD / prolog markers of an XML-external-entity attack (external
# `<!ENTITY … SYSTEM/PUBLIC>`, parameter-entity `<!ENTITY % …>` definitions, and —
# default-off — external `<!DOCTYPE … SYSTEM/PUBLIC>`, bare `%name;` references,
# internal-entity expansion / billion-laughs) on the SAME normalised view text as
# the other structural detectors. It runs NO XML parser: the XXE grammar is a set
# of textual markers, and not parsing removes the entire parse-time DoS surface
# (billion-laughs entity expansion / deep nesting / oversized entities) — the
# input is already length/token-bounded by the preprocessor budget, so every rule
# is a bounded linear scan and the billion-laughs indicator is a bounded frequency
# count, never an expansion. Single detector → weight 1.0; FP control is by narrow
# default-on rules (external entity decl / parameter-entity def, essentially never
# benign) + default-off high-noise rules (external DOCTYPE as used by every XHTML
# page, bare `%name;`, a few internal entity decls). Shadow (log_only): a single
# default-on hit scores its confidence (entity_external 90, param_entity_def 80)
# and is recorded/logged, never blocked. hard_veto_allowlist empty until holdout.
[content_security.attacks.xxe]
enabled = true
log_threshold = 40
block_threshold = 80
hard_veto_allowlist = []              # empty until holdout-calibrated (no single-hit Block authorised)
[content_security.attacks.xxe.weights]
xxe_struct = 1.0                      # structural XXE detector (T2-A)

# NoSQL (MongoDB-style operator) injection — T2-B single-detector structural family.
# The signal lives in a JSON OBJECT KEY (`{"pw":{"$ne":null}}` — `$ne` is the key),
# not a string value, so the body field-extractor additionally surfaces every
# `$`-prefixed JSON key as its own leaf (serde has already unicode-unescaped it, so a
# `$`-encoded operator is caught); the detector anchored-matches known operators
# against those leaves. It runs NO query engine and adds no parse surface beyond the
# already-bounded JSON walk (depth / node / field budgets), so a deep / billion-laughs
# JSON body is declined by the same guard the value extraction uses. FP honesty: a
# reverse proxy cannot know the backend is MongoDB and comparison operators recur in
# legitimate JSON APIs, so this is a FP-prone family. Single detector → weight 1.0;
# FP control is by a narrow DEFAULT-ON rule (only `$where`/`$function`/`$accumulator`,
# the server-side-JS-execution operators a client API essentially never lets a user
# control, confidence 90) + DEFAULT-OFF high-noise rules (`$expr`, which evaluates an
# aggregation expression but does not run arbitrary JS and is a common legitimate
# operator; `$regex`; comparison `$ne`/`$gt`/…; logical `$or`/`$and`/`$nor`) held back
# until holdout calibration. Shadow (log_only): a default-on hit is recorded/logged,
# never blocked.
# hard_veto_allowlist empty until holdout.
[content_security.attacks.nosql_injection]
enabled = true
log_threshold = 40
block_threshold = 80
hard_veto_allowlist = []              # empty until holdout-calibrated (no single-hit Block authorised)
[content_security.attacks.nosql_injection.weights]
nosql_struct = 1.0                    # structural NoSQL operator detector (T2-B)

# SSTI (server-side template injection) — T2-C single-detector structural family.
# Detects expression-delimiter + dangerous-sink CO-OCCURRENCE and polyglot exec /
# reflection / sandbox-escape sinks (`freemarker.template.utility.Execute`,
# `T(java.…)` SpEL type evaluator, `getClass().forName(`, `__import__(`, the Python
# `__mro__`/`__subclasses__`/`__globals__` dunder chain, `<% … system(…) %>`) on the
# SAME normalised view text as the other structural detectors. It runs NO template
# engine and has NO parser at all — every rule is a single bounded-regex scan over the
# already length/token-bounded preprocessor output, so there is no recursion and thus
# NO parse-time stack-overflow / template-expansion DoS surface (the P0 depth-bound
# red-line targets recursive parsers; a pure-regex detector has none). HONEST BOUNDARY
# (RASP ceiling): a reverse proxy sees only the payload and can never confirm the
# backend actually evaluates the template (`{{7*7}}` is only known to be SSTI once
# something renders it to `49`); these rules judge whether a payload LOOKS structurally
# like SSTI, not whether it truly executed. FP honesty: SSTI is the worst FP family —
# bare `{{ }}` / `${ }` / `#{ }` delimiters are ubiquitous in legitimate content (JS
# template literals incl. the i18n `${t('key')}` idiom, Angular/Vue interpolation,
# SCSS/CSS-in-JS, shell `${VAR}`, Ruby interpolation), so EVERY bare-delimiter rule is
# DEFAULT-OFF. Single detector → weight 1.0; FP control is by narrow DEFAULT-ON rules
# (exec/reflection/sandbox sinks that are essentially never benign + delimiter-gated
# co-occurrence like `{{…config.items…}}` / `<%… system(…) %>`) + DEFAULT-OFF
# high-noise rules (bare delimiters, `{{7*7}}` arithmetic probe, lone `.__class__`,
# lone `getClass(`, bare FreeMarker/Velocity directives) held back until holdout
# calibration. Shadow (log_only): a default-on hit is recorded/logged, never blocked.
# hard_veto_allowlist empty until holdout.
[content_security.attacks.ssti]
enabled = true
log_threshold = 40
block_threshold = 80
hard_veto_allowlist = []              # empty until holdout-calibrated (no single-hit Block authorised)
[content_security.attacks.ssti.weights]
ssti_struct = 1.0                     # structural SSTI detector (T2-C)

# LDAP injection — T2-D single-detector structural family. Detects LDAP
# search-filter injection: a payload that closes an existing filter clause and
# re-opens a new one carrying a logical operator (`)(|(`) or an attribute
# assignment (`)(uid=`), the canonical wildcard auth-bypass (`*)(uid=*`), and the
# RFC-4515 hex-escape (`\29\28`) and null-byte truncation (`))\00`) evasion
# variants — on the SAME normalised view text as the other structural detectors.
# It runs NO LDAP parser and has NO parser at all: every rule is a single
# bounded-regex scan over a backtracking-free automaton (linear time regardless of
# input), so there is no recursion, no catastrophic-backtracking (ReDoS) and thus
# NO parse-time stack-overflow / DoS surface (the P0 depth-bound red-line targets
# recursive parsers; a pure-regex detector has none). HONEST BOUNDARY (RASP
# ceiling): a reverse proxy sees only the payload and can never confirm the backend
# actually issues an LDAP search against it (the same field could feed SQL, a log
# line, or nothing); these rules judge whether a payload LOOKS structurally like an
# LDAP filter injection, not whether an LDAP query truly consumed it. FP honesty:
# LDAP filter metacharacters (`*` `(` `)` `&` `|`) recur EVERYWHERE in legitimate
# text, URLs and code, so EVERY bare-metacharacter rule is DEFAULT-OFF. Single
# detector → weight 1.0; FP control is by narrow DEFAULT-ON rules (structural
# filter-break CO-OCCURRENCE + escape/null-byte evasion signatures that are
# essentially never benign) + DEFAULT-OFF high-noise rules (generic `)(<any>=`
# break, bare `(|(` grouping, lone `*`/`(`/`)`/`&`/`|`) held back until holdout
# calibration. Shadow (log_only): a default-on hit is recorded/logged, never
# blocked. hard_veto_allowlist empty until holdout.
[content_security.attacks.ldap_injection]
enabled = true
log_threshold = 40
block_threshold = 80
hard_veto_allowlist = []              # empty until holdout-calibrated (no single-hit Block authorised)
[content_security.attacks.ldap_injection.weights]
ldap_struct = 1.0                     # structural LDAP-injection detector (T2-D)

# XPath injection — T2-E single-detector structural family. Detects XPath /
# XQuery injection: a payload that closes an existing location-step / predicate /
# string literal and re-opens a new node path or tautology to subvert node
# selection or bypass authentication — a node-axis union (`] | //`), a
# quote-closed tautology (`' or '1'='1`), a predicate/quote close chained to a
# logical operator (`'] or`), a logical operator immediately calling an XPath
# node function (`' or position()`, `or count(`), an XPath string function pulling
# from an absolute axis (`count(//`, `substring(name(`), and a node axis with a
# functional predicate (`//*[contains(`) — on the SAME normalised view text as the
# other structural detectors. It runs NO XPath parser and has NO parser at all:
# every rule is a single bounded-regex scan over a backtracking-free automaton
# (linear time regardless of input), so there is no recursion, no
# catastrophic-backtracking (ReDoS) and thus NO parse-time stack-overflow / DoS
# surface (the P0 depth-bound red-line targets recursive parsers; a pure-regex
# detector has none). HONEST BOUNDARY (RASP ceiling): a reverse proxy sees only
# the payload and can never confirm the backend actually evaluates an XPath / XQuery
# expression against it (the same field could feed SQL, a log line, or nothing);
# these rules judge whether a payload LOOKS structurally like an XPath injection,
# not whether an XPath query truly consumed it. (The quote tautology deliberately
# overlaps the SQLi family; both record independently, which is fine.) FP honesty:
# XPath tokens (`//`, `or`/`and`, `[`/`]`, `count(`/`substring(`) recur EVERYWHERE
# in legitimate text, URLs and code, so EVERY bare-token rule is DEFAULT-OFF.
# Single detector → weight 1.0; FP control is by narrow DEFAULT-ON rules
# (structural CO-OCCURRENCE signatures that are essentially never benign) +
# DEFAULT-OFF high-noise rules (bare `//`, bare `or`/`and`, lone `[`/`]`, bare
# `count(`) held back until holdout calibration. Shadow (log_only): a default-on
# hit is recorded/logged, never blocked. hard_veto_allowlist empty until holdout.
[content_security.attacks.xpath_injection]
enabled = true
log_threshold = 40
block_threshold = 80
hard_veto_allowlist = []              # empty until holdout-calibrated (no single-hit Block authorised)
[content_security.attacks.xpath_injection.weights]
xpath_struct = 1.0                    # structural XPath-injection detector (T2-E)

# Unsafe deserialization — T2-F single-detector structural family. Detects
# cross-language serialized-object injection / gadget chains by SIGNATURE, NOT by
# deserializing: it matches each language's serialization FORMAT MAGIC plus the
# KNOWN EXPLOIT GADGET CLASS / DANGEROUS OPCODE that weaponises it — Java stream
# magic in base64 (`rO0AB…`, i.e. `\xAC\xED\x00\x05` encoded) or hex (`aced0005`)
# form + ysoserial gadget classes (`InvokerTransformer`, `TemplatesImpl`,
# `JdbcRowSetImpl`, `BadAttributeValueExpException`, `BeanComparator`); PHP
# `serialize()` typed-object header (`O:<len>:"<class>":<n>:{`) + `phar://`
# wrapper; Python pickle `GLOBAL`-opcode reductions to system/exec
# (`cos\nsystem`, `c__builtin__\neval`, `csubprocess\n…`); and .NET
# `BinaryFormatter`/`LosFormatter` base64 header (`AAEAAAD/////`) + gadget markers
# (`ObjectDataProvider`, `TypeConfuseDelegate`, `ActivitySurrogateSelector`) — on
# the SAME normalised view text as the other structural detectors, INCLUDING the
# base64/hex DECODED views the preprocessor already produces (serialized payloads
# are routinely base64-wrapped: `rO0AB…` and `AAEAAAD/////` hit the raw view
# directly, a wrapped pickle hits its decoded view). It invokes NO deserializer
# and has NO parser at all: every rule is a single bounded-regex scan over a
# backtracking-free automaton (linear time regardless of input), so there is no
# recursion, no catastrophic-backtracking (ReDoS) and thus NO parse-time
# stack-overflow / DoS surface (the P0 depth-bound red-line targets recursive
# parsers; a pure-regex detector has none). HONEST BOUNDARY (RASP ceiling): a
# reverse proxy sees only the payload and can never confirm the backend actually
# DESERIALIZES it — a magic, gadget name or pickle opcode could sit inertly in a
# log line or a base64 attachment; these rules judge whether a payload PRESENTS a
# known unsafe-deserialization format / gadget signature, not whether it was
# deserialized. FP honesty: a bare base64 blob, a lone class-name substring and a
# PHP array header `a:\d+:{` recur in legitimate traffic, so DEFAULT-ON ships ONLY
# serialization magic + known exploit gadget/opcode; the generic markers (PHP
# array header, bare `__reduce__`, generic `org.apache.commons.collections`
# package) are DEFAULT-OFF until holdout calibration. Single detector → weight 1.0.
# Shadow (log_only): a default-on hit is recorded/logged, never blocked.
# hard_veto_allowlist empty until holdout.
[content_security.attacks.deserialization]
enabled = true
log_threshold = 40
block_threshold = 80
hard_veto_allowlist = []              # empty until holdout-calibrated (no single-hit Block authorised)
[content_security.attacks.deserialization.weights]
deser_struct = 1.0                    # structural unsafe-deserialization detector (T2-F)
