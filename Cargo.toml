[workspace]
members = [
    "crates/prx-waf",
    "crates/gateway",
    "crates/waf-engine",
    "crates/waf-storage",
    "crates/waf-api",
    "crates/waf-common",
    "crates/waf-cluster",
]
resolver = "2"

[workspace.package]
version = "0.2.207"
edition = "2024"
# Not a policy number, a measurement. The dependency graph refuses anything
# older: wasmtime 47, cranelift 0.134 and sqlx 0.9 each declare rustc 1.94.0, so
# `cargo check` under 1.93 stops at resolution. 1.94.0 then checks the whole
# workspace, all targets and all features, clean. Edition 2024 puts a lower
# floor of 1.85 under that, which nothing has been near for some time.
#
# Raise this when a dependency bump raises it, not on a calendar. Verify the
# same way: `cargo +<new>` checks clean and `cargo +<new minus one>` does not.
rust-version = "1.94"
authors = ["g1e2x87"]
license = "MIT OR Apache-2.0"
description = "Pingora-based web application firewall with YAML rules engine"
repository = "https://github.com/openprx/prx-waf"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP proxy.
#
# `rustls` is not decoration: pingora-core's default feature set is empty, and
# with no TLS backend selected `crate::tls` resolves to
# `protocols::tls::noop_tls` (pingora-core-0.8.1/src/lib.rs:121-122), whose
# listener acceptor is `unimplemented!("No tls feature was specified")`
# (noop_tls/mod.rs:95) and whose *upstream* connector hands back a stream that
# reads instant EOF and swallows every write (noop_tls/mod.rs:128-152). So the
# feature buys two separate things: the ability to terminate TLS on
# `[proxy] listen_addr_tls` at all, and an origin dialled over real TLS when a
# site sets `ssl`/`upstream_ssl` — which until now was a silent black hole that
# surfaced only as a 502.
#
# `rustls` rather than `openssl`/`boringssl`/`s2n` because deny.toml bans
# openssl and openssl-sys outright ("Use rustls-tls instead"), and because the
# other three all drag a C library into a tree whose only native code is ring
# and zstd-sys. The price is spelled out in deny.toml's RUSTSEC-2025-0134
# entry: pingora-rustls takes tokio-rustls and rustls at default features, so
# aws-lc-rs returns to the graph and rustls-pemfile arrives unmaintained. The
# process still pins `ring` explicitly at startup (crates/prx-waf/src/main.rs).
pingora-core = { version = "0.8", features = ["rustls"] }
pingora-proxy = { version = "0.8", features = ["rustls"] }
pingora-http = { version = "0.8" }
pingora-timeout = { version = "0.8" }

# API framework
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Database - PostgreSQL. `default-features = false` is a supply-chain guard, not
# a size optimisation: the mysql driver depends on `rsa`, which carries
# RUSTSEC-2023-0071 (Marvin) with no fixed release. Turning it on here would put
# that crate back in the graph — the jsonwebtoken backend below is the other
# half of keeping it out.
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "chrono", "uuid", "json"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
dashmap = "6"
regex = "1"
ipnet = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
bytes = "1"
http = "1"
# Only for `geteuid`, which the graceful-upgrade socket's directory check needs
# and std does not expose. Already in the tree under pingora, and taken here in
# preference to a raw `libc` call because the workspace denies `unsafe_code`.
nix = { version = "0.24", features = ["user"] }

# Phase 3 additions
rhai = { version = "1", features = ["sync"] }
aho-corasick = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
instant-acme = "0.8"
rcgen = "0.14"
base64 = "0.23"
# HTML5 parser (Servo html5ever core) for the Lane 2 XSS DOM semantic detector
# (P-XSS-1). WHATWG-compliant fragment parsing + tree walk; no C toolchain. Our
# own code stays zero-unsafe (the transitive tendril/ego-tree unsafe is mature,
# audited Servo code, accepted per plan §2.4 option A).
scraper = "0.27"

# Phase 4 additions
argon2 = { version = "0.5", features = ["std"] }
# `aws_lc_rs`, not the `rust_crypto` default, and the two are mutually
# exclusive: jsonwebtoken picks its process-wide CryptoProvider from crate
# features (crypto/mod.rs `from_crate_features`) and panics on the first
# sign/verify if both or neither are on. The reason for choosing this one is
# supply chain, not speed — `rust_crypto` is one monolithic feature that drags
# in `rsa`, which carries RUSTSEC-2023-0071 (Marvin) with no fixed release, and
# there is no HMAC-only subset to ask for. aws-lc-rs is already in the tree via
# `pingora-core/rustls`, so this costs no new C dependency. We sign and verify
# HS256 only; the backend swap is transparent to already-issued tokens because
# both implementations compute the same RFC 7515 HMAC-SHA256.
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
aes-gcm = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1", "smtp-transport", "builder"] }
rust-embed = "8"
mime_guess = "2"
sha2 = "0.11"
hex = "0.4"
rand = "0.8"
totp-lite = "2"
data-encoding = "2"

# Phase 5 additions
wasmtime = { version = "47.0.0", default-features = false, features = ["cranelift", "runtime", "component-model", "std", "anyhow"] }
moka = { version = "0.12", features = ["future"] }
quinn = { version = "0.11", features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls-pki-types = { version = "1", features = ["std"] }
futures-util = "0.3"

# Phase 7 additions
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

# URL validation
url = "2"

# Cluster additions
lz4_flex = "0.14"
hmac = "0.13"
time = { version = "0.3", default-features = false, features = ["std"] }
parking_lot = "0.12"

# Prometheus exposition. `prometheus-client` is the Prometheus project's own
# Rust client; it is picked over the two alternatives for dependency weight,
# which for a proxy that already links Pingora, sqlx, wasmtime and rustls is the
# deciding factor:
#
#   * `prometheus` (tikv) drags in a whole `protobuf` 3.x runtime plus a second
#     `thiserror` major, to serve a format this endpoint never emits;
#   * `metrics` + `metrics-exporter-prometheus` adds `evmap`, `quanta`,
#     `sketches-ddsketch` and a *second* hyper + rustls + hyper-rustls stack for
#     a push gateway nothing here uses;
#   * this adds `dtoa` and `itoa` — and reuses the `parking_lot`, `syn`, `quote`
#     and `proc-macro2` already in the graph.
#
# Only its `Registry`/`Collector`/text-encoder half is used. The counters
# themselves are the lock-free tables in `waf-common::metrics`, because the
# library's `Family` takes a read lock and allocates a label set per increment.
prometheus-client = "0.25"

# Signature verification
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
# Ed25519 sign/verify for cluster election quorum certificates. Already the sole
# crypto provider in the tree (rustls/quinn/rcgen all build on it), and rcgen
# mints the node keys through it, so the PKCS#8 encoding round-trips exactly.
ring = "0.17"
zstd = "0.13"

# X.509 parsing (cluster peer certificate SAN → node identity binding, H-9)
#
# 0.16 -> 0.18 behaviour note, relevant to node_id_from_cert_der() in
# crates/waf-cluster/src/transport/identity.rs: 0.18 added a `GeneralName::Invalid`
# variant "so an invalid entry does not stop parsing". Before, a leaf whose SAN
# held a malformed entry made subject_alternative_name() error and the peer was
# rejected; now parsing continues and the loop simply skips the bad entry, so a
# later well-formed DNS SAN still yields a node id. The `if let
# GeneralName::DNSName(..)` match still compiles unchanged. This is a
# fail-closed -> fail-open relaxation, bounded by the fact that rustls has
# already path-validated the leaf against our own single-level cluster CA before
# that function runs, and the CA only ever mints certs via
# NodeCertificate::generate. 0.17 also tightened X509StructureValidator (date
# encoding, version > 1 for issuer/subjectUniqueID) and added RSA-PSS
# verification. Transitives asn1-rs 0.7 / der-parser 10 / oid-registry 0.8 are
# consumed only by x509-parser, so no duplicate parser stack; nom stays at v7.
x509-parser = "0.18"

# Lane 2 (semantic) structured-body field extraction (Lane B). All forbid unsafe
# in their own code; each parser/walk is depth-bounded by our own guards.
#   quick-xml >= 0.41 fixes RUSTSEC-2026-0194 + RUSTSEC-2026-0195 (two DoS advisories).
quick-xml = "0.41"
async-graphql-parser = "7.2"
async-graphql-value = "7.2"
multer = "3.1"
pollster = "1"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"

inefficient_to_string = "deny"
large_futures = "warn"

module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
cast_lossless = "warn"
too_many_lines = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
