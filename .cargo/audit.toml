# Audit policy for prx-waf.
#
# THIS FILE IS NOT THE SOURCE OF TRUTH. Every exemption is argued in `deny.toml`
# under `[advisories] ignore`, with the evidence, a `review-by:` date and a
# `remove-when:` condition. cargo-audit cannot read deny.toml and offers no
# include mechanism, so the ID list below is a forced duplicate — keep it byte-
# for-byte in sync with the IDs in deny.toml and put the reasoning THERE, not
# here. The "Ignore expiry review" job in .github/workflows/sec-audit.yml fails
# the build if the two sets diverge.
#
# Why the two files used to disagree: cargo-audit only *denies* what
# `severity_threshold` + `[output] deny` select (vulnerabilities and
# `unmaintained`), while cargo-deny additionally fails on `unsound = "workspace"`.
# Advisories that are unsound-only therefore had to be listed in deny.toml but
# were invisible to cargo-audit, and the lists drifted apart. Syncing the IDs
# unconditionally is harmless — an ID cargo-audit never raises is simply inert —
# and it removes the drift.
#
# Re-verified against the live tree on 2026-07-25 with cargo-audit 0.22.1 and
# cargo-deny 0.20.2 (the version pinned by cargo-deny-action@v2).
#
# Current entries — full reasoning in deny.toml:
#   RUSTSEC-2023-0071  rsa 0.9.10 Marvin timing sidechannel. Compiled via
#                      jsonwebtoken(rust_crypto) -> waf-api, but waf-api signs
#                      and verifies JWTs only with HMAC/HS256, so the RSA
#                      private-key path is never invoked. No upstream fix
#                      (patched = []). jsonwebtoken 11.0.0 still declares
#                      `rsa ^0.9.6` under rust_crypto, so upgrading it does not
#                      remove the crate.
#   RUSTSEC-2024-0437  protobuf 2.28.0 recursive-parsing crash, via
#                      pingora-core -> prometheus 0.13 -> protobuf v2.
#   RUSTSEC-2025-0069  daemonize 0.5.0 unmaintained, via pingora-core.
#   RUSTSEC-2024-0388  derivative 2.2.0 unmaintained, via pingora-core
#                      (build-time derive macro only).
[advisories]
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2024-0437",
    "RUSTSEC-2025-0069",
    "RUSTSEC-2024-0388",
]
informational_warnings = ["unmaintained"]
severity_threshold = "low"

[database]
fetch = true
stale = false

[output]
deny = ["unmaintained"]
format = "terminal"
quiet = false
show_tree = true

[yanked]
enabled = true
update_index = true
