# cargo-deny configuration — OpenPRX standard v2

[graph]
all-features = true
exclude-dev = false

[output]
feature-depth = 1

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "workspace"
#
# ----------------------------------------------------------------------------
# IGNORE POLICY — read before adding an entry
# ----------------------------------------------------------------------------
# The global severity settings above are the contract; they are never relaxed to
# make a build green. An advisory may only be silenced per-ID below, and only
# after one of the following has been written down with concrete evidence
# (file:line, Cargo.lock excerpt, or a quote from the advisory text):
#   a) the vulnerable code path is unreachable in THIS project, or
#   b) every removal/upgrade path has been evaluated and rejected in writing.
# "Ignore it for now so CI passes" is not an accepted reason.
#
# Each entry carries two machine-readable tags in its comment block:
#   review-by:   YYYY-MM-DD — hard deadline for re-verifying the reasoning.
#   remove-when: <condition> — the concrete event that makes the entry obsolete.
# The "Ignore expiry review" job in .github/workflows/sec-audit.yml parses the
# review-by tags and fails the build once one is past due, so an exemption can
# never silently outlive its justification.
#
# Verification baseline: every entry below was re-checked against the live
# dependency tree on 2026-07-25 using cargo-deny 0.20.2 — the version pinned by
# EmbarkStudios/cargo-deny-action@v2, which is what CI actually runs. Older
# local cargo-deny builds (0.19.x) evaluate `unsound = "workspace"` differently
# and will under-report; reproduce CI with the pinned version, not with
# whatever `cargo install cargo-deny` left on your machine.
ignore = [
    # protobuf 2.28.0 recursive-parsing stack overflow — path: prometheus 0.13.4 -> protobuf v2,
    # pulled by pingora-core 0.8.0. protobuf v2 has no fix; pingora 0.8 pins prometheus 0.13.
    # No safe pingora release yet (main has moved off it, but no 0.9.x published). Verified present.
    # review-by: 2026-10-01
    # remove-when: pingora publishes a release that no longer pins prometheus 0.13 / protobuf v2.
    { id = "RUSTSEC-2024-0437", reason = "protobuf v2: transitive via pingora 0.8 -> prometheus 0.13; no fixed release, pingora-locked" },
    # daemonize 0.5.0 unmaintained — path: pingora-core 0.8.0. Only used by pingora's daemon-mode
    # process forking; no maintained replacement until pingora drops it. Verified present.
    # review-by: 2026-10-01
    # remove-when: pingora-core drops the daemonize dependency, or daemonize is adopted again.
    { id = "RUSTSEC-2025-0069", reason = "daemonize: unmaintained, pingora 0.8 transitive; no replacement until pingora upgrades" },
    # derivative 2.2.0 unmaintained — path: pingora-core 0.8.0. Build-time derive macro only,
    # not part of the shipped runtime. Verified present.
    # review-by: 2026-10-01
    # remove-when: pingora-core migrates off derivative (e.g. to derive-where / educe).
    { id = "RUSTSEC-2024-0388", reason = "derivative: unmaintained build-time derive macro, pingora 0.8 transitive" },
    # proc-macro-error2 2.0.1 unmaintained — path: pingora-cache 0.8.0 -> cf-rustracing-jaeger ->
    # local-ip-address -> neli -> getset -> proc-macro-error2. Build-time proc-macro only, never
    # linked into the runtime binary; pingora-locked. Verified present.
    # review-by: 2026-10-01
    # remove-when: the getset/neli chain under pingora-cache stops pulling proc-macro-error2.
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2: unmaintained build-time proc-macro, pingora 0.8 transitive; not in runtime" },
    # rsa 0.9.10 Marvin timing sidechannel — NO fixed release exists upstream (patched = []).
    # Real path: rsa -> jsonwebtoken (rust_crypto) -> waf-api, so the crate IS compiled. However
    # waf-api signs and verifies JWTs exclusively with HMAC (EncodingKey/DecodingKey::from_secret
    # => HS256, Validation::default() locks the algorithm to HS256, see crates/waf-api/src/auth.rs).
    # The RSA private-key operations Marvin targets are never invoked, so it is not exploitable here.
    #
    # Removal paths evaluated & rejected on 2026-07-19 (goal: get rsa out of Cargo.lock entirely):
    #   1. jsonwebtoken HMAC-only feature trim — IMPOSSIBLE. jsonwebtoken 10.3/10.4 gate all
    #      RustCrypto algorithms behind one monolithic `rust_crypto` feature that hard-bundles
    #      rsa together with hmac (features = [ed25519-dalek, hmac, p256, p384, rand, rsa, sha2]);
    #      there is no HMAC-only sub-feature, so rsa cannot be excluded while keeping HS256.
    #   2. jsonwebtoken `aws_lc_rs` backend — TECHNICALLY WORKS (rsa leaves the tree, all 13 auth
    #      unit tests pass with auth.rs unchanged) but REJECTED: it re-adds aws-lc-rs/aws-lc-sys,
    #      directly reversing commit 1b7e23f which deliberately purged aws-lc-rs so that `ring`
    #      is the sole crypto provider (dual providers previously panicked rustls at cluster/HTTP3
    #      startup) and adds a cmake/C-toolchain build burden.
    #   3. Replace jsonwebtoken with a pure-Rust HMAC lib (jwt crate) or a hand-rolled HS256 —
    #      REJECTED: rewrites security-critical auth token signing/verification (regression risk
    #      against the auth red-line) or pulls in an unmaintained crate, to silence an advisory
    #      that is already unexploitable with no upstream fix.
    # Conclusion: keeping this documented ignore is the lowest-real-risk option.
    # review-by: 2026-10-01
    # remove-when: the rsa crate ships a constant-time release, or jsonwebtoken exposes an
    #              HMAC-only feature that drops rsa from the tree without re-adding aws-lc-rs.
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin: compiled via jsonwebtoken(rust_crypto) but waf-api uses only HMAC/HS256; RSA code path unreachable; no upstream fix; removal via aws_lc_rs rejected (reverses ring-only commit 1b7e23f), feature-trim impossible (rust_crypto bundles rsa+hmac), lib swap risks auth regression" },

    # ------------------------------------------------------------------------
    # Bridge entries — a fixed upstream release EXISTS for both of the advisories
    # below. They are ignored here only because the fix is a pure Cargo.lock bump
    # that this change is not permitted to make (Cargo.lock is owned by a
    # concurrent workstream / dependabot). Both are short-fused on purpose: they
    # are the first things to delete, not entries to be renewed.
    # ------------------------------------------------------------------------

    # anyhow 1.0.102 — Stacked Borrows UB in `Error::downcast_mut()` (unsound).
    # Trigger per the advisory: build an error with `Error::context(..)` and then call
    # `downcast_mut()` on the resulting `anyhow::Error`. BOTH steps are required.
    #
    # Reachability in this project — NOT REACHABLE:
    #   * The workspace never calls `downcast_mut` at all: `grep -rn downcast --include=*.rs crates/`
    #     returns exactly one hit, crates/waf-cluster/src/transport/identity.rs:37, and that is
    #     `Box<dyn Any>::downcast::<Vec<CertificateDer>>()` on a rustls value — a different method
    #     on a different type, not `anyhow::Error`.
    #   * Dependency scan: every .rs file of every crate in Cargo.lock was grepped for
    #     `downcast_mut` (56 hits). All but one are `Box<dyn Any>` / `AnyMap` downcasts
    #     (http::Extensions, wasmtime ResourceTable, cranelift compiler, tracing-subscriber
    #     registry, rhai, zerocopy, ...) and have nothing to do with anyhow. The single genuine
    #     `anyhow::Error::downcast_mut` is wit-parser 0.245.1 src/ast.rs:1836/1840/1858
    #     (`use anyhow::{Context, Result, bail}` at ast.rs:7).
    #   * wit-parser is reachable only through `wasmtime-internal-component-macro` (a proc-macro):
    #     wit-parser -> wasmtime-internal-component-macro (proc-macro) -> wasmtime 43.0.2 ->
    #     waf-engine. Proc-macros execute inside rustc at compile time and are never linked into
    #     the shipped prx-waf binary, so no request-handling path can reach it. Worst case is UB
    #     in the compiler on a build host, not in the WAF at runtime.
    #
    # review-by: 2026-09-01
    # remove-when: Cargo.lock carries anyhow >= 1.0.103 — ALREADY STAGED in dependabot PR #40
    #              (anyhow 1.0.102 -> 1.0.104, "Fix Stacked Borrows violation (UB) in
    #              Error::downcast_mut"). That PR was itself blocked by this advisory, so this
    #              entry exists to break the deadlock and MUST be deleted once #40 lands.
    { id = "RUSTSEC-2026-0190", reason = "anyhow Error::downcast_mut UB: workspace calls downcast_mut zero times; the only real anyhow downcast_mut in the graph is wit-parser 0.245.1, reachable solely via the wasmtime component-macro proc-macro (compile-time, never linked into the binary). Fix 1.0.104 exists and is staged in dependabot PR #40 — bridge entry only, delete on merge" },

    # rand 0.8.5 — ThreadRng aliasing UB when re-entered from a custom logger (unsound).
    # rand 0.8.5 is a direct workspace dependency (Cargo.toml:83, `rand = "0.8"`); rand 0.9.2 and
    # 0.10.2 are also in the tree but 0.10.2 is already >= the patched 0.10.1, and cargo-deny
    # flags only 0.8.5 under `unsound = "workspace"`.
    #
    # The advisory requires ALL FIVE conditions to hold simultaneously. Two independent ones fail:
    #   1. "The `log` and `thread_rng` features are enabled" — NOT MET. `log` is an *optional*
    #      dependency of rand (rand-0.8.5/Cargo.toml:33-35, `[dependencies.log] optional = true`)
    #      and it is not activated anywhere in the graph: the `rand 0.8.5` entry in Cargo.lock
    #      lists exactly `libc`, `rand_chacha 0.3.1`, `rand_core 0.6.4` — no `log`. Confirmed
    #      independently with `cargo tree --all-features -e features -i log`, which shows no rand
    #      parent. With the feature off, rand's trace!/warn! macros expand to nothing
    #      (rand-0.8.5/src/lib.rs:64-88, each arm gated on `#[cfg(feature = "log")]`), so
    #      ThreadRng physically cannot call back into a logger while reseeding.
    #   3. "The custom logger accesses rand::rng() ... and calls RngCore methods on ThreadRng" —
    #      NOT MET. The workspace implements no `log::Log` and never calls `log::set_logger`
    #      (grep for `impl log::Log` / `set_logger` over crates/ returns nothing). Logging is
    #      tracing, initialised at crates/prx-waf/src/main.rs:298 via
    #      `tracing_subscriber::registry().with(fmt::layer())...init()`.
    #      NOTE on "does tracing count as a custom logger": the graph does contain one
    #      `log::Log` implementation — tracing-log 0.2.0's `LogTracer`, pulled in by
    #      tracing-subscriber 0.3.23. It qualifies as a custom logger for condition 2, but it only
    #      forwards `log` records into `tracing` and never touches rand, so condition 3 still
    #      fails. The workspace's own `rand::thread_rng()` call sites — crates/waf-api/src/auth.rs
    #      lines 164 and 243, crates/waf-cluster/src/election/mod.rs:291 — are ordinary code
    #      paths, not logger callbacks, and therefore cannot produce the reentrancy the advisory
    #      describes.
    #   5. "Trace-level logging enabled, or warn-level plus a getrandom failure" — moot once (1)
    #      fails, since the logging calls are compiled out entirely.
    #
    # review-by: 2026-09-01
    # remove-when: Cargo.lock carries rand >= 0.8.6 (0.8.7 is published and semver-compatible
    #              with the `rand = "0.8"` requirement, so `cargo update -p rand` is sufficient
    #              and needs no manifest change). No open PR stages this bump — whoever owns
    #              Cargo.lock next should run it and delete this entry.
    { id = "RUSTSEC-2026-0097", reason = "rand ThreadRng/logger UB needs rand's optional `log` feature (NOT enabled: Cargo.lock lists only libc/rand_chacha/rand_core for rand 0.8.5, and lib.rs:64-88 compiles the log calls out) AND a custom log::Log that itself draws from thread_rng (workspace defines none; the only log::Log in the graph is tracing-log's LogTracer, which never touches rand). Fix 0.8.7 exists via a lockfile-only `cargo update -p rand` — bridge entry only" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.8
include-dev = false
include-build = true
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[[licenses.clarify]]
crate = "maker"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
allow-workspace = true
highlight = "all"

deny = [
    { crate = "openssl", reason = "Use rustls-tls instead", use-instead = "rustls" },
    { crate = "openssl-sys", reason = "Use rustls-tls instead" },
]

[[bans.features]]
crate = "reqwest"
deny = ["native-tls", "native-tls-vendored"]

[bans.workspace-dependencies]
duplicates = "warn"
unused = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = [
    "https://github.com/lionsoul2014/ip2region.git",
]
