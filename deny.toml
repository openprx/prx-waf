# cargo-deny configuration — OpenPRX standard v2

[graph]
all-features = true
exclude-dev = false

[output]
feature-depth = 1

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "workspace"
#
# ----------------------------------------------------------------------------
# IGNORE POLICY — read before adding an entry
# ----------------------------------------------------------------------------
# The global severity settings above are the contract; they are never relaxed to
# make a build green. An advisory may only be silenced per-ID below, and only
# after one of the following has been written down with concrete evidence
# (file:line, Cargo.lock excerpt, or a quote from the advisory text):
#   a) the vulnerable code path is unreachable in THIS project, or
#   b) every removal/upgrade path has been evaluated and rejected in writing.
# "Ignore it for now so CI passes" is not an accepted reason.
#
# Each entry carries two machine-readable tags in its comment block:
#   review-by:   YYYY-MM-DD — hard deadline for re-verifying the reasoning.
#   remove-when: <condition> — the concrete event that makes the entry obsolete.
# The "Ignore expiry review" job in .github/workflows/sec-audit.yml parses the
# review-by tags and fails the build once one is past due, so an exemption can
# never silently outlive its justification.
#
# SINGLE SOURCE OF TRUTH. This list is the only place an exemption is argued.
# `.cargo/audit.toml` must carry the exact same set of IDs — cargo-audit cannot
# read this file and has no include mechanism, so the duplication is forced by
# the tooling, not a second opinion. Its entries are a bare ID list plus a
# pointer back here; never add an ID there that is missing here, or vice versa.
# The "Ignore expiry review" job asserts the two sets are identical.
#
# Verification baseline: every entry below was re-checked against the live
# dependency tree on 2026-07-25 using cargo-deny 0.20.2 — the version pinned by
# EmbarkStudios/cargo-deny-action@v2, which is what CI actually runs. Older
# local cargo-deny builds (0.19.x) evaluate `unsound = "workspace"` differently
# and will under-report; reproduce CI with the pinned version, not with
# whatever `cargo install cargo-deny` left on your machine.
#
# Removed on 2026-07-25 after a semver-compatible `cargo update` (lockfile only):
#   RUSTSEC-2026-0190 (anyhow)          — fixed by anyhow 1.0.102 -> 1.0.104
#   RUSTSEC-2026-0097 (rand)            — fixed by rand   0.8.5   -> 0.8.7
#   RUSTSEC-2026-0173 (proc-macro-error2) — crate left the graph when
#       getset 0.1.6 -> 0.1.7 dropped it under pingora-cache -> ... -> neli.
# cargo-deny 0.20.2 confirmed all three with `warning[advisory-not-detected]`
# before they were deleted.
ignore = [
    # protobuf 2.28.0 recursive-parsing stack overflow — path: prometheus 0.13.4 -> protobuf v2,
    # pulled by pingora-core 0.8.0. protobuf v2 has no fix; pingora 0.8 pins prometheus 0.13.
    # No safe pingora release yet (main has moved off it, but no 0.9.x published). Verified present.
    # review-by: 2026-10-01
    # remove-when: pingora publishes a release that no longer pins prometheus 0.13 / protobuf v2.
    { id = "RUSTSEC-2024-0437", reason = "protobuf v2: transitive via pingora 0.8 -> prometheus 0.13; no fixed release, pingora-locked" },
    # daemonize 0.5.0 unmaintained — path: pingora-core 0.8.0. Only used by pingora's daemon-mode
    # process forking; no maintained replacement until pingora drops it. Verified present.
    # review-by: 2026-10-01
    # remove-when: pingora-core drops the daemonize dependency, or daemonize is adopted again.
    { id = "RUSTSEC-2025-0069", reason = "daemonize: unmaintained, pingora 0.8 transitive; no replacement until pingora upgrades" },
    # derivative 2.2.0 unmaintained — path: pingora-core 0.8.0. Build-time derive macro only,
    # not part of the shipped runtime. Verified present.
    # review-by: 2026-10-01
    # remove-when: pingora-core migrates off derivative (e.g. to derive-where / educe).
    { id = "RUSTSEC-2024-0388", reason = "derivative: unmaintained build-time derive macro, pingora 0.8 transitive" },
    # rsa 0.9.10 Marvin timing sidechannel — NO fixed release exists upstream (patched = []).
    # Real path: rsa -> jsonwebtoken (rust_crypto) -> waf-api, so the crate IS compiled. This is the
    # only entry in this file whose argument is "compiled but unreachable", so the reachability
    # claim is spelled out below against the actual vendored source rather than asserted.
    #
    # UNREACHABILITY PROOF — re-done on 2026-07-25 against jsonwebtoken 11.0.0 source
    # (the earlier version of this comment only cited 10.4.0; 11.0.0 was read line by line and
    # is strictly tighter, see "what 11.0 changed" at the end). Paths below are relative to
    # the vendored crate root ~/.cargo/registry/src/*/jsonwebtoken-11.0.0/.
    #
    #   1. rsa is still in the graph. Cargo.toml:53-61 defines
    #      `rust_crypto = ["dep:ed25519-dalek","dep:hmac","dep:p256","dep:p384","dep:rand","dep:rsa","dep:sha2"]`
    #      and Cargo.toml:125-127 pins `rsa = "0.9.6"` (optional). Still one monolithic feature,
    #      still no HMAC-only sub-feature. Cargo.lock keeps rsa 0.9.10.
    #   2. The only call sites in this repo are crates/waf-api/src/auth.rs:51 (encode) and
    #      auth.rs:65 (decode). `rg 'jsonwebtoken|insecure_decode|jws::'` over crates/ finds
    #      nothing else: no `dangerous::insecure_decode`, no `jws::decode`, no custom
    #      `CryptoProvider::install_default` for jsonwebtoken.
    #   3. Signing side: encoding.rs:34-36 `EncodingKey::from_secret` hardcodes
    #      `family: AlgorithmFamily::Hmac`. The `family` field is private (encoding.rs:21-25) and
    #      has only a getter (`:29-31`) — no API can retag an HMAC key as RSA. encoding.rs:151-154
    #      then rejects the call outright when `key.family != header.alg.family()`, so
    #      `Header::default()` (header.rs:273-278 => `Algorithm::default()` => HS256,
    #      algorithms.rs:41-46) is the only header that can be signed with our key.
    #      The signer factory (crypto/rust_crypto/mod.rs:91-108) therefore only ever reaches the
    #      `Algorithm::HS256` arm at :93; the RS*/PS* arms at :98-103 — the ones that call
    #      `try_sign_rsa` -> `RsaPrivateKey::from_pkcs1_der` + `SigningKey::sign_with_rng`
    #      (crypto/rust_crypto/rsa.rs:24-41), which IS the Marvin-affected private-key operation —
    #      are unreachable.
    #   4. Verifying side: decoding.rs:95-100 `DecodingKey::from_secret` likewise hardcodes
    #      `family: AlgorithmFamily::Hmac` with a private field (decoding.rs:77-81).
    #      decoding.rs:270-291 `decode()` checks `!validation.algorithms.contains(&header.alg)`
    #      at :278-280 and returns InvalidAlgorithm BEFORE the verifier factory runs at :282, so a
    #      forged `alg: RS256` header cannot even construct an RSA verifier.
    #      verify_signature_body (decoding.rs:325-351) re-checks family (:336-340) and membership
    #      (:342-344) unconditionally afterwards.
    #   5. `Validation::default()` is HS256-only: validation.rs:161-165 `fn default() -> Self {
    #      Self::new(Algorithm::HS256) }` -> `new` (:110-112) -> `new_impl` (:119-137) sets
    #      `algorithms: vec![alg]`. So `validation.algorithms == [HS256]` exactly. auth.rs:61-64
    #      overrides only `leeway`; every other field, including `algorithms`, comes from Default.
    #      `required_spec_claims` is byte-identical to 10.4.0: `{"exp"}` (validation.rs:120-124).
    #   6. Belt and braces: even if 3./4. were bypassed, crypto/rust_crypto/rsa.rs:103-106
    #      (`define_rsa_verifier`) and :75-77 (`define_rsa_signer`) reject any key whose
    #      `family() != AlgorithmFamily::Rsa` with InvalidKeyFormat before touching rsa math.
    #      Our keys are always AlgorithmFamily::Hmac. Two independent barriers, not one.
    #   Conclusion: rsa's Marvin-affected code is linked in but has no reachable caller here.
    #
    # What 11.0 changed, and in which direction: 10.4.0 gated all four checks in decoding.rs
    # (10.4.0 decoding.rs:283, :337, :341, :349, :353) on a `pub(crate) validate_signature` flag
    # that `Validation::insecure_disable_signature_validation()` could clear. 11.0.0 deleted the
    # field and the method (CHANGELOG "BREAKING: `Validation.insecure_disable_signature_validation`
    # has been removed") and made all four checks unconditional; the opt-out now lives in the
    # separate `dangerous::insecure_decode` entry point (lib.rs:15-18), which we do not call.
    # 11.0 also made HMAC signer construction verify the algorithm family. Net effect on this
    # exemption: strictly stronger. `Algorithm` becoming `#[non_exhaustive]` (algorithms.rs:42)
    # does not affect us — we never match on it.
    #
    # Removal paths evaluated & rejected on 2026-07-19, re-checked against 11.0.0 on 2026-07-25
    # (goal: get rsa out of Cargo.lock entirely):
    #   1. jsonwebtoken HMAC-only feature trim — STILL IMPOSSIBLE in 11.0.0. All RustCrypto
    #      algorithms remain behind one monolithic `rust_crypto` feature that hard-bundles rsa
    #      together with hmac (Cargo.toml:53-61, features = [ed25519-dalek, hmac, p256, p384,
    #      rand, rsa, sha2]); there is no HMAC-only sub-feature, so rsa cannot be excluded while
    #      keeping HS256. 11.0.0's "implicit features removed" change did not split this up.
    #   2. jsonwebtoken `aws_lc_rs` backend — TECHNICALLY WORKS (rsa leaves the tree, all 13 auth
    #      unit tests pass with auth.rs unchanged) but REJECTED: it re-adds aws-lc-rs/aws-lc-sys,
    #      directly reversing commit 1b7e23f which deliberately purged aws-lc-rs so that `ring`
    #      is the sole crypto provider (dual providers previously panicked rustls at cluster/HTTP3
    #      startup) and adds a cmake/C-toolchain build burden.
    #   3. Replace jsonwebtoken with a pure-Rust HMAC lib (jwt crate) or a hand-rolled HS256 —
    #      REJECTED: rewrites security-critical auth token signing/verification (regression risk
    #      against the auth red-line) or pulls in an unmaintained crate, to silence an advisory
    #      that is already unexploitable with no upstream fix.
    # Conclusion: keeping this documented ignore is the lowest-real-risk option.
    # review-by: 2026-10-01
    # remove-when: the rsa crate ships a constant-time release, or jsonwebtoken exposes an
    #              HMAC-only feature that drops rsa from the tree without re-adding aws-lc-rs.
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin: compiled via jsonwebtoken(rust_crypto) but waf-api uses only HMAC/HS256; RSA code path unreachable; no upstream fix; removal via aws_lc_rs rejected (reverses ring-only commit 1b7e23f), feature-trim impossible (rust_crypto bundles rsa+hmac), lib swap risks auth regression" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.8
include-dev = false
include-build = true
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[[licenses.clarify]]
crate = "maker"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
allow-workspace = true
highlight = "all"

deny = [
    { crate = "openssl", reason = "Use rustls-tls instead", use-instead = "rustls" },
    { crate = "openssl-sys", reason = "Use rustls-tls instead" },
]

[[bans.features]]
crate = "reqwest"
deny = ["native-tls", "native-tls-vendored"]

[bans.workspace-dependencies]
duplicates = "warn"
unused = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = [
    "https://github.com/lionsoul2014/ip2region.git",
]
