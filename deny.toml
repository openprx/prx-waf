# cargo-deny configuration — OpenPRX standard v2

[graph]
all-features = true
exclude-dev = false

[output]
feature-depth = 1

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "workspace"
#
# ----------------------------------------------------------------------------
# IGNORE POLICY — read before adding an entry
# ----------------------------------------------------------------------------
# The global severity settings above are the contract; they are never relaxed to
# make a build green. An advisory may only be silenced per-ID below, and only
# after one of the following has been written down with concrete evidence
# (file:line, Cargo.lock excerpt, or a quote from the advisory text):
#   a) the vulnerable code path is unreachable in THIS project, or
#   b) every removal/upgrade path has been evaluated and rejected in writing.
# "Ignore it for now so CI passes" is not an accepted reason.
#
# Each entry carries two machine-readable tags in its comment block:
#   review-by:   YYYY-MM-DD — hard deadline for re-verifying the reasoning.
#   remove-when: <condition> — the concrete event that makes the entry obsolete.
# The "Ignore expiry review" job in .github/workflows/sec-audit.yml parses the
# review-by tags and fails the build once one is past due, so an exemption can
# never silently outlive its justification.
#
# SINGLE SOURCE OF TRUTH. This list is the only place an exemption is argued.
# `.cargo/audit.toml` must carry the exact same set of IDs — cargo-audit cannot
# read this file and has no include mechanism, so the duplication is forced by
# the tooling, not a second opinion. Its entries are a bare ID list plus a
# pointer back here; never add an ID there that is missing here, or vice versa.
# The "Ignore expiry review" job asserts the two sets are identical.
#
# Verification baseline: every entry below was re-checked against the live
# dependency tree on 2026-07-25 using cargo-deny 0.20.2 — the version pinned by
# EmbarkStudios/cargo-deny-action@v2, which is what CI actually runs. Older
# local cargo-deny builds (0.19.x) evaluate `unsound = "workspace"` differently
# and will under-report; reproduce CI with the pinned version, not with
# whatever `cargo install cargo-deny` left on your machine.
#
# Removed on 2026-07-25 after a semver-compatible `cargo update` (lockfile only):
#   RUSTSEC-2026-0190 (anyhow)          — fixed by anyhow 1.0.102 -> 1.0.104
#   RUSTSEC-2026-0097 (rand)            — fixed by rand   0.8.5   -> 0.8.7
#   RUSTSEC-2026-0173 (proc-macro-error2) — crate left the graph when
#       getset 0.1.6 -> 0.1.7 dropped it under pingora-cache -> ... -> neli.
# cargo-deny 0.20.2 confirmed all three with `warning[advisory-not-detected]`
# before they were deleted.
#
# Removed on 2026-07-30 because the crate left the graph, not because the
# reasoning was rewritten:
#   RUSTSEC-2023-0071 (rsa, Marvin timing sidechannel) — the only path was
#       rsa -> jsonwebtoken(rust_crypto) -> waf-api. jsonwebtoken now takes its
#       `aws_lc_rs` backend instead, and `cargo tree -i rsa` reports
#       "package ID specification `rsa` did not match any packages".
#       cargo-deny 0.20.2 agreed with `warning[advisory-not-detected]` before
#       the entry was deleted. This one had a long unreachability proof
#       attached, arguing that waf-api only ever signs and verifies HS256; that
#       argument is gone with the entry, because a crate that is not compiled
#       needs no reachability argument. The HS256-only property it described is
#       still true and still enforced, in `waf-api/src/auth.rs` — see the
#       comment on `validate_access_token`.
ignore = [
    # protobuf 2.28.0 recursive-parsing stack overflow — path: prometheus 0.13.4 -> protobuf v2,
    # pulled by pingora-core 0.8.0. protobuf v2 has no fix; pingora 0.8 pins prometheus 0.13.
    # No safe pingora release yet (main has moved off it, but no 0.9.x published). Verified present.
    # review-by: 2026-10-01
    # remove-when: pingora publishes a release that no longer pins prometheus 0.13 / protobuf v2.
    { id = "RUSTSEC-2024-0437", reason = "protobuf v2: transitive via pingora 0.8 -> prometheus 0.13; no fixed release, pingora-locked" },
    # daemonize 0.5.0 unmaintained — path: pingora-core 0.8.0. Only used by pingora's daemon-mode
    # process forking; no maintained replacement until pingora drops it. Verified present.
    # review-by: 2026-10-01
    # remove-when: pingora-core drops the daemonize dependency, or daemonize is adopted again.
    { id = "RUSTSEC-2025-0069", reason = "daemonize: unmaintained, pingora 0.8 transitive; no replacement until pingora upgrades" },
    # derivative 2.2.0 unmaintained — path: pingora-core 0.8.0. Build-time derive macro only,
    # not part of the shipped runtime. Verified present.
    # review-by: 2026-10-01
    # remove-when: pingora-core migrates off derivative (e.g. to derive-where / educe).
    { id = "RUSTSEC-2024-0388", reason = "derivative: unmaintained build-time derive macro, pingora 0.8 transitive" },
    # rustls-pemfile 2.2.0 unmaintained (repository archived August 2025) — arrived on
    # 2026-07-29 with `pingora-core/rustls`, the feature that makes the proxy able to
    # terminate TLS at all. Two paths, both inside pingora-rustls 0.8.1:
    #   pingora-rustls 0.8.1 -> rustls-pemfile 2.2.0            (direct)
    #   pingora-rustls 0.8.1 -> rustls-native-certs 0.7.3 -> rustls-pemfile 2.2.0
    # cargo-deny reports "Solution: No safe upgrade is available!" — pingora-rustls
    # 0.8.1's manifest pins `rustls-pemfile = "2.1.2"` and there is no 3.x to move to;
    # the crate was archived rather than superseded, its functionality having been
    # folded into rustls-pki-types' PemObject trait.
    #
    # This is an unmaintained advisory, not a vulnerability: no CVE, no known defect,
    # no attacker-reachable claim. The code is a PEM tokenizer that pingora runs once
    # per process, while constructing the TLS listener, over certificate and key files
    # named in this WAF's own configuration. It never sees network input.
    #
    # Removal paths evaluated & rejected on 2026-07-29:
    #   1. Switch pingora to the `openssl` or `boringssl` backend — REJECTED, and not
    #      by preference: `[bans] deny` in this same file bans `openssl` and
    #      `openssl-sys` by name. Verified empirically, not assumed: building with
    #      `pingora-core/openssl` clears the advisories check but fails bans with
    #      `error[banned]: crate 'openssl = 0.10.81' is explicitly banned` and the
    #      same for openssl-sys 0.9.117. boringssl and s2n substitute a different C
    #      library for the same reason and are no better on supply chain.
    #   2. Ship without any TLS backend (the status quo before this entry) — REJECTED.
    #      That is what left `[proxy] listen_addr_tls` inert since it was introduced,
    #      and it also made an `ssl = true` origin a silent black hole; see the
    #      pingora block in Cargo.toml for the noop_tls line numbers.
    #   3. `[patch.crates-io]` a local pingora-rustls with `default-features = false`
    #      on tokio-rustls/rustls, which is also the only way to keep aws-lc-rs out —
    #      REJECTED: `[sources] unknown-git = "deny"` and vendoring a Cloudflare crate
    #      to carry a one-line manifest change is a larger and more permanent supply
    #      chain liability than one archived PEM parser.
    # review-by: 2026-10-01
    # remove-when: pingora-rustls drops rustls-pemfile for rustls-pki-types' PemObject
    #              (upstream tracking issue rustls/pemfile#61), or pingora publishes a
    #              release whose rustls backend no longer depends on it.
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: unmaintained (archived), pingora-rustls 0.8.1 transitive with no upgrade path; parses only files this process wrote, never network input; the alternative backends are banned by [bans] in this file" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.8
include-dev = false
include-build = true
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[[licenses.clarify]]
crate = "maker"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
allow-workspace = true
highlight = "all"

deny = [
    { crate = "openssl", reason = "Use rustls-tls instead", use-instead = "rustls" },
    { crate = "openssl-sys", reason = "Use rustls-tls instead" },
]

[[bans.features]]
crate = "reqwest"
deny = ["native-tls", "native-tls-vendored"]

[bans.workspace-dependencies]
duplicates = "warn"
unused = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = [
    "https://github.com/lionsoul2014/ip2region.git",
]
