name: Fuzz

on:
  push:
    branches: [main]
    paths:
      - "fuzz/**"
      - "crates/waf-engine/src/checks/content_security/**"
      - "crates/waf-engine/src/checks/owasp.rs"
      - "crates/waf-engine/src/rules/formats/**"
      - "crates/gateway/src/smuggling.rs"
      - "crates/waf-common/src/url_validator.rs"
      - ".github/workflows/fuzz.yml"
  pull_request:
    branches: [main]
    paths:
      - "fuzz/**"
      - "crates/waf-engine/src/checks/content_security/**"
      - "crates/waf-engine/src/checks/owasp.rs"
      - "crates/waf-engine/src/rules/formats/**"
      - "crates/gateway/src/smuggling.rs"
      - "crates/waf-common/src/url_validator.rs"
      - ".github/workflows/fuzz.yml"
  schedule:
    # Mondays 04:00 UTC — before the 06:00 sec-audit slot so the two long jobs
    # do not contend for runners.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to fuzz each target"
        required: false
        default: "600"

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only: this workflow never writes to the repository. Crash reproducers
# leave as build artifacts, not commits, because a committed reproducer for an
# unfixed parser bug is a published exploit.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

  # ---------------------------------------------------------------------------
  # PINNED NIGHTLY — temporary, and the pin is the whole reason this line exists.
  #
  # WHY: nightly-2026-07-24 (rustc 89c61a754) introduced an ICE that makes
  # `tokio` 1.53.1 — a transitive dependency of `gateway`, and therefore of every
  # fuzz target — fail to compile:
  #
  #   error: internal compiler error: rustc_codegen_ssa/src/mir/operand.rs:291:18:
  #     not immediate: OperandRef(Uninit @ ...
  #     UnsafeCell<MaybeUninit<runtime::task::Notified<Arc<multi_thread::handle::Handle>>>>)
  #
  # It is NOT a sanitizer problem. A plain `cargo +nightly-2026-07-24 build
  # --release` of tokio 1.53.1 reproduces it with no RUSTFLAGS at all, so
  # dropping `-Zsanitizer=address` or the sancov flags would cost real detection
  # power and still not build. Nor is it fixable by moving tokio: 1.53.1 is the
  # newest release, and the dependency arrives through `gateway`/`pingora`.
  #
  # Bisected against tokio 1.53.1:
  #   nightly-2026-07-23 (rustc 6f72b5dd5, 2026-07-22)  OK   <- pinned here
  #   nightly-2026-07-24 (rustc 89c61a754, 2026-07-23)  ICE  <- first bad
  #   nightly-2026-07-25 (rustc da86f4d07, 2026-07-24)  ICE
  #
  # Upstream: rust-lang/rust#159815 (I-ICE, regression-from-stable-to-nightly).
  # Root cause is rust-lang/rust#157797, which added `OperandValue::Uninit` but
  # missed the `PassMode::Direct | PassMode::Pair` branch of
  # `codegen_return_terminator`. Fix in flight as rust-lang/rust#159825.
  #
  # HOW TO UNPIN: when #159825 (or an equivalent) has ridden a nightly, delete
  # this variable and restore the two `${{ env.FUZZ_NIGHTLY }}` references below
  # to plain `nightly`. Do not guess the date — the `unpin-check` job at the
  # bottom of this file probes the floating nightly every Monday and says so in
  # the run summary the moment the pin becomes unnecessary.
  # ---------------------------------------------------------------------------
  FUZZ_NIGHTLY: nightly-2026-07-23

jobs:
  fuzz:
    # Regression mode on every PR/push (short, seeded); soak mode on the weekly
    # cron and on manual dispatch.
    name: ${{ github.event_name == 'schedule' && 'Soak' || 'Regression' }} — ${{ matrix.target }}
    runs-on: ubuntu-latest
    # 30 min ceiling covers the longest soak (1800s of fuzzing) plus the build.
    timeout-minutes: 60
    strategy:
      # One target's crash must not cancel the others — we want the full picture
      # in a single run, not the first failure.
      fail-fast: false
      matrix:
        target:
          - preprocess_header
          - struct_extract
          - content_security
          - owasp_crs
          - modsec_parse
          - smuggling_headers
          - url_validator
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # cargo-fuzz needs nightly for -Z sanitizer / -C instrument-coverage.
      # `toolchain:` overrides the action's default of floating `nightly`; see
      # the FUZZ_NIGHTLY block at the top for why it is pinned and how to lift.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.FUZZ_NIGHTLY }}
          components: llvm-tools-preview

      # `fuzz/` is its own workspace (see fuzz/Cargo.toml), so it needs its own
      # cache key; sharing the root workspace's cache would thrash both.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          key: fuzz-${{ matrix.target }}

      # RUSTUP_TOOLCHAIN is set per step rather than job-wide because the
      # `unpin-check` job below deliberately needs the floating nightly. Setting
      # it explicitly (instead of relying on the installer having made this the
      # default) keeps the job working even if a later step installs stable
      # alongside it — cargo-fuzz shells out to `cargo build` with
      # `-Zsanitizer=address`, which stable rejects.
      - name: Install cargo-fuzz
        env:
          RUSTUP_TOOLCHAIN: ${{ env.FUZZ_NIGHTLY }}
        run: cargo install cargo-fuzz --locked --version ^0.13

      - name: Determine run length
        id: budget
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_SECONDS: ${{ github.event.inputs.seconds }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            schedule)          seconds=1800 ;;
            workflow_dispatch) seconds="${DISPATCH_SECONDS:-600}" ;;
            *)                 seconds=60 ;;
          esac
          # Reject a non-numeric or absurd dispatch input rather than feeding it
          # straight to libFuzzer.
          case "$seconds" in
            ''|*[!0-9]*) echo "::error::seconds must be a positive integer"; exit 1 ;;
          esac
          if [ "$seconds" -gt 3000 ]; then
            echo "::error::seconds must be <= 3000 to stay inside the job timeout"
            exit 1
          fi
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"

      # Carry the corpus a soak grows forward into the *next* soak instead of
      # starting from the committed seeds every week. Only wired up for
      # schedule/workflow_dispatch (the long runs, 600-1800s): a 60s
      # push/pull_request regression is meant to be the fixed, seeded check
      # the README describes, and giving it a growing, non-reproducible
      # corpus would make it neither fast nor deterministic.
      #
      # Key design:
      #   * One cache per target (`fuzz-corpus-<target>-...`) — the seven
      #     corpora are unrelated inputs and must never merge.
      #   * The save key embeds `github.run_id`, which is unique every run, so
      #     `actions/cache` never reports an exact hit and therefore always
      #     saves the post-run (post-cmin) corpus at the end of the job. Restore
      #     falls through to `restore-keys`, a prefix match with no run id,
      #     which resolves to the most recently saved entry for this target.
      #     This is the standard "ever-growing cache" shape: it does NOT key
      #     on any hash of source or rule content, so a code change never
      #     invalidates accumulated corpus (the entire point — corpus value is
      #     about input shapes, not the commit that happened to be checked out
      #     when they were found).
      #   * No explicit expiry/rotation beyond that: `cargo fuzz cmin` below
      #     bounds the size that gets saved each run, and GitHub's own 10GB/repo
      #     LRU eviction plus 7-day-unused eviction reclaims the orphaned
      #     entry from the previous run (it can never be restored again once a
      #     newer one exists, so it is dead weight the moment this save lands).
      #   * Branch scoping is GitHub's, not ours, and it works in our favour:
      #     a cache save is scoped to the branch it ran on, while restore may
      #     read the current branch, its PR base branch, or the repo default
      #     branch. `schedule` only ever fires on the default branch, so in
      #     practice only `main`'s own runs write this cache. A manually
      #     dispatched soak on a feature branch *can* still read main's
      #     accumulated corpus (good — full coverage from the first second)
      #     but its own save lands in a cache scoped to that branch, so it can
      #     never leak into (or evict) main's entry. Nothing here can pollute
      #     main from a branch.
      - name: Restore fuzz corpus
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      # Corpus arguments: libFuzzer writes new units only into the FIRST
      # directory, so `corpus/` is the throwaway working set and `seeds/` is
      # mounted read-only alongside it. That keeps the committed seeds curated.
      #
      # Flags worth their salt here:
      #   -timeout=25     a stalled input (catastrophic regex backtracking,
      #                   exponential expansion) becomes a reportable hang
      #                   instead of a silent job timeout. This is the primary
      #                   finding mode for owasp_crs.
      #   -rss_limit_mb   runaway allocation becomes a reportable OOM.
      #   -max_len=8192   the depth guards under test sit at 64 nested levels
      #                   and 256 raw brackets. With libFuzzer's default length
      #                   ramp a short run never generates an input long enough
      #                   to reach them, so the guards would go untested.
      #   -len_control=0  disables that ramp, for the same reason.
      #   -dict           where a dictionary exists, it is what lets the mutator
      #                   assemble nested/structured documents at all.
      #
      # `working-directory: fuzz` is load-bearing: cargo-fuzz resolves
      # `-artifact_prefix` to an absolute path but passes the corpus directories
      # through to libFuzzer verbatim, so they are relative to the invocation
      # directory. Running this from the repository root fails with
      # `The required directory "corpus/<target>" does not exist`.
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        env:
          RUSTUP_TOOLCHAIN: ${{ env.FUZZ_NIGHTLY }}
          TARGET: ${{ matrix.target }}
          SECONDS_BUDGET: ${{ steps.budget.outputs.seconds }}
          # owasp_crs loads the real CRS rule set; resolve it from the checkout
          # rather than relative to the fuzz working directory.
          PRX_WAF_FUZZ_RULES_DIR: ${{ github.workspace }}/rules/owasp-crs
        run: |
          set -euo pipefail
          mkdir -p "corpus/${TARGET}"
          dict_arg=()
          if [ -f "dictionaries/${TARGET}.dict" ]; then
            dict_arg=("-dict=dictionaries/${TARGET}.dict")
          fi
          cargo fuzz run "${TARGET}" \
            "corpus/${TARGET}" "seeds/${TARGET}" \
            -- \
            "${dict_arg[@]}" \
            -max_total_time="$SECONDS_BUDGET" \
            -max_len=8192 \
            -len_control=0 \
            -timeout=25 \
            -rss_limit_mb=4096 \
            -print_final_stats=1

      # Bound what the cache above saves: a soak's corpus grows without limit
      # (tens of thousands of units), and the cache has a 10GB/repo cap shared
      # with every other workflow's cache, so an ever-growing corpus must be
      # minimized before it is persisted or it eventually either evicts other
      # caches or makes every future save slower. `cmin` re-runs the corpus
      # through the target and keeps only the files that contribute distinct
      # coverage, in place, in the same `corpus/<target>` directory the cache
      # step (and a local repro session) expects.
      #
      # `always()` because a crash on this target still leaves a corpus worth
      # minimizing and carrying forward, and the plain job condition alone
      # would otherwise skip this step whenever the Fuzz step above failed.
      - name: Minimize corpus (cmin)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && always()
        working-directory: fuzz
        env:
          RUSTUP_TOOLCHAIN: ${{ env.FUZZ_NIGHTLY }}
          TARGET: ${{ matrix.target }}
          PRX_WAF_FUZZ_RULES_DIR: ${{ github.workspace }}/rules/owasp-crs
        run: cargo fuzz cmin "${TARGET}" "corpus/${TARGET}"

      # Only runs when the Fuzz step failed, i.e. libFuzzer wrote a reproducer.
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}-${{ github.run_id }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30

      # The corpus the soak grew (already minimized above) is worth a
      # human-inspectable copy alongside the cache: an artifact can be
      # browsed/downloaded from the run summary without `gh cache`, and it
      # survives even if the cache entry above is later evicted. The cache
      # step, not this artifact, is what actually carries the corpus into the
      # *next* run — nothing reads this artifact back in. Not committed — it
      # is tens of thousands of files, and `seeds/` is the curated set instead.
      - name: Upload grown corpus
        if: github.event_name == 'schedule' && always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 14

  # ===========================================================================
  # Is the FUZZ_NIGHTLY pin still needed?
  #
  # A pin with no expiry is how a two-day workaround becomes a two-year one, so
  # this job builds a fuzz target against the *floating* nightly every Monday
  # and reports whether the ICE is gone. It is a probe, not a gate:
  #
  #   * It never runs on push/pull_request, so it is not in the merge path.
  #   * The `fuzz` jobs above stay pinned and still fail hard on a real crash —
  #     nothing here weakens them, and neither uses `continue-on-error`.
  #   * Its expected steady state is "upstream still broken", which is not a
  #     repository failure and is reported as a notice, not a red X.
  #
  # It does still fail for real when the floating nightly breaks in a way that
  # is NOT the known ICE, because that is a new problem worth a red X.
  # ===========================================================================
  unpin-check:
    name: Nightly pin still needed?
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Deliberately unpinned: probing today's nightly is the entire point.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Install cargo-fuzz
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: cargo install cargo-fuzz --locked --version ^0.13

      - name: Probe floating nightly
        working-directory: fuzz
        env:
          RUSTUP_TOOLCHAIN: nightly
          PRX_WAF_FUZZ_RULES_DIR: ${{ github.workspace }}/rules/owasp-crs
        run: |
          # Deliberately no `set -e`: a failing build is the expected outcome
          # while the upstream ICE is unfixed. This step classifies that failure
          # instead of inheriting it.
          set -uo pipefail

          version="$(rustc --version)"
          echo "Probing with: $version"

          # struct_extract stands in for all seven targets: they share the whole
          # dependency tree, and tokio is what ICEs.
          cargo fuzz build struct_extract 2>&1 | tee probe.log
          status="${PIPESTATUS[0]}"

          {
            echo "## Nightly pin probe"
            echo
            echo "- Pinned toolchain: \`${FUZZ_NIGHTLY}\`"
            echo "- Probed toolchain: \`${version}\`"
            echo "- Tracking: rust-lang/rust#159815, fix rust-lang/rust#159825"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -eq 0 ]; then
            {
              echo "**The pin is no longer needed.** The floating nightly builds the"
              echo "fuzz targets. Remove \`FUZZ_NIGHTLY\` from this workflow and restore"
              echo "the two references to plain \`nightly\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Fuzz nightly pin can be removed::${version} builds the fuzz targets; drop FUZZ_NIGHTLY from .github/workflows/fuzz.yml"
            exit 0
          fi

          if grep -q "internal compiler error" probe.log; then
            echo "Still broken upstream — the pin stays. No action needed." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Fuzz nightly pin still required::${version} still ICEs; keeping FUZZ_NIGHTLY"
            exit 0
          fi

          # Not the known ICE: something else broke, and that deserves a red X.
          echo "Probe failed WITHOUT an ICE — a new failure, not the tracked one." >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Fuzz nightly probe failed unexpectedly::Build failed on ${version} without an internal compiler error"
          exit 1
