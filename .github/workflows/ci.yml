name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Everything else in this file reads Rust source or Cargo metadata. A
  # CHANGELOG.md carrying eighty lines of unresolved conflict markers therefore
  # passed every gate and reached main, and was noticed by accident days later.
  # This job reads the whole tree instead, needs no toolchain and no cache, and
  # finishes in seconds. It gates the others so that a conflicted tree costs one
  # runner-minute rather than thirty.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Conflict markers
        run: scripts/check-conflict-markers.sh
      # A malformed fragment is only discovered when someone tries to cut a
      # release, which is the worst moment to find out. python3 is on the
      # runner image; the script imports nothing outside the standard library.
      - name: Changelog fragments
        run: scripts/changelog.py check

  lint:
    name: Lint
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Unused deps
        run: |
          cargo install cargo-machete --locked
          cargo machete

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --all-features

  # Mandatory gate for the DB-backed content-security engine parity suite.
  # `cargo test --workspace` (the `test` job) SKIPS these #[ignore]d tests, so
  # this job is the forcing function that actually runs the 20 engine-entry
  # parity tests through the real DB-backed `WafEngine`. It must stay green for
  # any change touching the content-security detection path.
  db-parity:
    name: DB Parity (content-security engine gate)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prx_waf
          POSTGRES_PASSWORD: prx_waf
          POSTGRES_DB: prx_waf
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U prx_waf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run DB-gated content-security engine parity tests
        env:
          DATABASE_URL: postgresql://prx_waf:prx_waf@127.0.0.1:15432/prx_waf
        run: cargo test -p waf-engine --test content_security_engine_parity -- --ignored --nocapture

      # waf-storage's suites are #[ignore]d for the same reason and were never
      # run anywhere: `cargo test --workspace` skips them and this job only
      # named the engine parity file. Retention, the observation round-trip and
      # the INET regressions all touch SQL that only a real server checks.
      # Serial because several of these prune the same tables untagged.
      - name: Run DB-gated storage tests
        env:
          DATABASE_URL: postgresql://prx_waf:prx_waf@127.0.0.1:15432/prx_waf
        run: cargo test -p waf-storage -- --ignored --nocapture --test-threads=1

  # The admin UI is TypeScript that nothing ever typechecked: `vite build`
  # transpiles and strips types without reading them, so a whole class of bug
  # shipped silently — a view reading `auth.token` off a store that only ever
  # exposed `accessToken` compiled fine and sent `Bearer undefined`. This job is
  # the forcing function. It stands alone rather than riding the Rust jobs
  # because it shares nothing with them and finishes in seconds.
  admin-ui:
    name: Admin UI (typecheck)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Vite 8 declares engines ^20.19.0 || >=22.12.0. Bare '20' would still
      # resolve to a 20.19.x that satisfies it, but Node 20 is out of support
      # and 22 is what the upgrade was verified on locally.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/admin-ui/package-lock.json
      # `-p tsconfig.app.json` (in the npm script) is load-bearing: the root
      # tsconfig also includes vite.config.ts, and without @types/node installed
      # that drags in ~40 `Cannot find module 'node:http'` errors that say
      # nothing about our source.
      - name: Typecheck admin UI
        working-directory: web/admin-ui
        run: |
          npm ci
          npm run typecheck

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # waf-api embeds web/admin-ui/dist via rust-embed. The tracked .gitkeep
      # only keeps the crate compilable; a release binary must carry the real
      # admin UI, so build the frontend before cargo.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/admin-ui/package-lock.json
      - name: Build admin UI
        working-directory: web/admin-ui
        run: |
          npm ci
          npm run build

      - name: Build release
        run: cargo build --workspace --release
