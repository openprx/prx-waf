version: "3.9"

services:
  # ── PostgreSQL database ──────────────────────────────────────────────────────
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: prx-waf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prx_waf
      POSTGRES_PASSWORD: prx_waf
      POSTGRES_DB: prx_waf
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prx_waf -d prx_waf"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "15432:5432"

  # ── PRX-WAF ──────────────────────────────────────────────────────────────────
  prx-waf:
    # The published multi-arch image (amd64 + arm64). It carries the same
    # binary the release tarballs do, cosign-signed and with SLSA provenance;
    # see docs/RELEASING.md for how to verify it before running it.
    #
    # `latest` never points at a pre-release. Pin a version in production:
    #   PRX_WAF_VERSION=v0.2.60 docker compose up -d
    #
    # To run your own build instead of the published one:
    #   cargo build --release
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/openprx/prx-waf:${PRX_WAF_VERSION:-latest}
    container_name: prx-waf
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # ⚠️ Required security secrets — the server refuses to start without them.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a strong random secret (>= 32 chars); see .env.example}
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY must be set to a strong random secret (>= 32 chars) for encryption at rest; see .env.example}
      # Optional bootstrap admin password (random one is generated & logged if unset).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://prx_waf:prx_waf@postgres:5432/prx_waf}
      RUST_LOG: ${RUST_LOG:-info}
    # The image already contains configs/ and rules/; these mounts shadow them
    # with this checkout's copies so that edits here take effect. That means
    # the checkout has to stay on the version you pinned above — a v0.2.60
    # image running rules from an unrelated commit is a configuration nobody
    # tested. Remove the two ro mounts to run the image's own copies instead.
    volumes:
      - ./configs:/app/configs:ro
      - ./rules:/app/rules:ro
      - waf_certs:/app/certs
    ports:
      - "16880:80"    # HTTP proxy
      - "16843:443"   # HTTPS proxy
      # Management API + Admin UI — host-side bind is intentionally restricted
      # to loopback by default (ADMIN_BIND_ADDR, see .env.example). The admin
      # API can rewrite WAF rules, upload WASM plugins, mint cluster-join
      # tokens and replace TLS certificates; its only gate is a JWT bootstrapped
      # from a once-printed password, so publishing it to every host interface
      # by default would expose that whole surface to the network. To allow
      # remote access, either set ADMIN_BIND_ADDR=0.0.0.0 in .env (and then
      # configure [security] admin_ip_allowlist in configs/default.toml), or
      # put a tunnel / reverse proxy in front of this port instead.
      - "${ADMIN_BIND_ADDR:-127.0.0.1}:16827:9527"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9527/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    cap_add:
      - NET_ADMIN      # required for Pingora raw socket support
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

volumes:
  postgres_data:
    driver: local
  waf_certs:
    driver: local
