version: '1.0'
description: Protocol Enforcement (OWASP CRS 920)
source: OWASP CRS v4.25.0
license: Apache-2.0
rules:
  # Body size enforcement (custom, not in standard CRS but critical)
  - id: CRS-920160
    name: Request body too large
    category: protocol-attack
    severity: critical
    paranoia: 1
    field: content_length
    operator: gt
    value: 10485760
    action: block
    tags:
      - owasp-crs
      - protocol-attack
    crs_id: 920160

  - id: CRS-920260
    name: Unicode Full/Half Width Abuse Attack Attempt
    category: protocol-attack
    severity: warning
    paranoia: 1
    field: path+body
    operator: regex
    value: (?i)%uff[0-9a-f]{2}
    action: block
    tags:
      - owasp-crs
      - protocol-attack
    crs_id: 920260

  - id: CRS-920350
    name: Host header is a numeric IP address
    category: protocol-attack
    severity: warning
    paranoia: 1
    field: header_host
    operator: regex
    value: (?:^([\d.]+|\[[\da-f:]+\]|[\da-f:]+)(:[\d]+)?$)
    action: block
    tags:
      - owasp-crs
      - protocol-attack
    crs_id: 920350

  - id: CRS-920610
    name: Raw (unencoded) fragment in request URI
    category: protocol-attack
    severity: critical
    paranoia: 1
    # Upstream reads REQUEST_URI_RAW with t:none: the rule exists to flag a
    # fragment that was *not* escaped, so a legitimate %23 must stay escaped.
    field: path_raw
    operator: contains
    value: '#'
    action: block
    tags:
      - owasp-crs
      - protocol-attack
    crs_id: 920610

  # CRS-920120 / CRS-920121 read `FILES` and `FILES_NAMES` — the `filename="…"`
  # and `name="…"` of each `multipart/form-data` file part, parsed by
  # crates/waf-engine/src/checks/multipart.rs. Both assert the same property
  # from opposite directions: a file name may not carry a quote, an apostrophe,
  # a semicolon, an `=` or a backslash, because those are what let an upload
  # smuggle a second parameter past a naive `Content-Disposition` parser.
  #
  # 920120 is a NEGATED head and is therefore only emitted because these two
  # variables survive inversion, which most do not. The argument is written out
  # in full at NEGATION_FAITHFUL_VARS in rules/tools/modsec2yaml.py; in short,
  # `!@rx` over a ModSecurity *collection* fires when any member fails the
  # pattern, so extracting fewer members than upstream can only make the rule
  # fire less — and the parser is built to emit nothing at all rather than a
  # truncated value. An upload whose parts fall outside the inspection window
  # contributes no members and cannot fire it.
  #
  # 920121 is the PL2 sibling: same surfaces, plain (non-negated) operator,
  # so it is unconditionally safe and would have been emitted either way.
  - id: CRS-920120
    name: Attempted multipart/form-data bypass
    category: protocol-attack
    severity: critical
    paranoia: 1
    field: files+files_names
    operator: regex
    value: |-
      (?i)^(?:&(?:(?:[acegilnorsuz]acut|[aeiou]grav|[aino]tild)e|[c-elnr-tz]caron|(?:[cgklnr-t]cedi|[aeiouy]um)l|[aceg-josuwy]circ|[au]ring|a(?:mp|pos)|nbsp|oslash);|[^\"';=\x5c])*$
    transform:
      - urlDecodeUni
    negate: true
    action: block
    tags:
      - owasp-crs
      - protocol-attack
      - attack-protocol
    crs_id: 920120

  - id: CRS-920121
    name: Attempted multipart/form-data bypass
    category: protocol-attack
    severity: critical
    paranoia: 2
    field: files+files_names
    operator: regex
    value: '[''\";=\x5c]'
    transform:
      - urlDecodeUni
    action: block
    tags:
      - owasp-crs
      - protocol-attack
      - attack-protocol
    crs_id: 920121

  # Upstream is `REQUEST_HEADERS:Content-Type "!@rx ^[\w/.+*-]+(...)*$"`: the
  # negation means "this header is not a well-formed media type", so the rule
  # fires on what the pattern *rejects*. Two properties keep that from becoming
  # a false-positive generator, and both are structural rather than lucky:
  #
  #   * `content_type` is the raw header, byte for byte, so inverting the
  #     operator does not silently widen the surface the way it would over a
  #     decoded or reconstructed field (see NEGATION_FAITHFUL_VARS in
  #     rules/tools/modsec2yaml.py).
  #   * a request with no `Content-Type` at all yields no value, and a
  #     condition with nothing to test cannot hold — so every ordinary GET is
  #     untouched, exactly as in ModSecurity, where an absent variable is not
  #     evaluated.
  #
  # What it does reject is a parameter name outside the RFC-blessed set
  # (`action|boundary|charset|component|start|start-info|type|version`), which
  # is upstream's deliberate allow-list and the whole point of the rule.
  - id: CRS-920470
    name: Illegal Content-Type header
    category: protocol-attack
    severity: critical
    paranoia: 1
    field: content_type
    operator: regex
    value: ^[\w/.+*-]+(?:\s?;\s*(?:action|boundary|charset|component|start(?:-info)?|type|version)\s?=\s?['\"\w.()+,/:=?<>@#*-]+)*$
    transform:
      - lowercase
    negate: true
    action: block
    tags:
      - owasp-crs
      - protocol-attack
      - attack-protocol
    crs_id: 920470

  - id: CRS-920200
    name: 'Range: Too many fields (6 or more)'
    category: protocol-attack
    severity: warning
    paranoia: 2
    field: header_range
    operator: regex
    value: ^bytes=(?:(?:\d+)?-(?:\d+)?\s*,?\s*){6}
    chain:
      - field: path
        operator: ends_with
        value: .pdf
        negate: true
    action: block
    tags:
      - owasp-crs
      - protocol-attack
    crs_id: 920200

  - id: CRS-920230
    name: Multiple URL Encoding Detected
    category: protocol-attack
    severity: warning
    paranoia: 2
    field: args
    operator: regex
    value: '%[0-9a-fA-F]{2}'
    action: block
    tags:
      - owasp-crs
      - protocol-attack
    crs_id: 920230

  - id: CRS-920460
    name: Abnormal character escapes in request
    category: protocol-attack
    severity: critical
    paranoia: 4
    field: path+args+args_names+headers
    operator: regex
    value: (?:^|[^\x5c])\x5c[cdeghijklmpqwxyz123456789]
    transform:
      - htmlEntityDecode
      - lowercase
    action: block
    tags:
      - owasp-crs
      - protocol-attack
    crs_id: 920460
