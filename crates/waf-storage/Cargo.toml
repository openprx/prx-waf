[package]
name = "waf-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
waf-common = { path = "../waf-common" }
sqlx = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Test-only: `#[tokio::test(start_paused = true)]` drives the retention
# scheduler's multi-hour timers deterministically without real sleeps.
tokio = { workspace = true, features = ["test-util"] }
# Test-only: shared call log for the retention scheduler tests. `parking_lot`
# (never `std::sync::Mutex`) per the crate's mutex rule.
parking_lot = { workspace = true }
# Test-only: capture the `warn!` a skipped CrowdSec mirror row emits, so
# "dropped silently" can never pass for "dropped and reported".
tracing-subscriber = { workspace = true }

[lints]
workspace = true
